# DEPRECATED: legacy pre-v2 config kept for reference only.
defaults:
  - legacy/configs/default.yaml

experiment:
  name: "shopping_qwen3vl4b_baseline"
  description: "Shopping baseline with local Qwen3-VL-4B (4-bit)"

task:
  dataset: "visualwebarena"
  config_file: "external/visualwebarena/config_files/vwa/test_shopping.raw.json"

env:
  dry_run: false

run:
  seed: 42
  num_shards: 1
  shard_id: 0
  resume: true
  max_retries: 1
  episode_timeout_s: 600
  output_dir: "results/shopping_qwen3vl4b_baseline"

agent:
  mode: "always_vision"
  max_steps: 40

model:
  path: "Qwen/Qwen3-VL-4B-Instruct"
  quantization: "4bit"
  device: "cuda"
  max_new_tokens: 512
  temperature: 0.1
  top_p: 0.9
