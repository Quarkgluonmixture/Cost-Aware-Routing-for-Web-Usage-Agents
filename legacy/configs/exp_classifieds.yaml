# DEPRECATED: legacy pre-v2 config kept for reference only.
# Inherit from default.yaml defaults
defaults:
  - legacy/configs/default.yaml

experiment:
  name: "classifieds_vwa_full"
  description: "Full VWA classifieds tasks from test_classifieds.raw.json"

task:
  dataset: "visualwebarena"
  config_file: "external/visualwebarena/config_files/vwa/test_classifieds.raw.json"
  # Optional: specific task IDs to run. If omitted, runs all in the file (subject to sharding)
  # task_ids: []

env:
  # Override default to use real VWA env (not dummy black screen)
  dry_run: false

run:
  seed: 42
  num_shards: 1
  shard_id: 0
  resume: true
  max_retries: 1
  episode_timeout_s: 600
  output_dir: "results/classifieds"

agent:
  mode: "always_vision" # Options: always_vision, dom_only, router_v0
  max_steps: 40

model:
  api_name: "qwen3-vl-plus-2025-12-19"
