StylesPath = styles
MinAlertLevel = suggestion
Vocab = Paper

[formats]
# Lint LaTeX as markdown. Known trade-off: commands leak as tokens, but
# existence-based slop rules rarely false-positive on them, and TokenIgnores
# below strips math and citation machinery.
tex = md

[*.{md,tex}]
BasedOnStyles = ai-tells, Paper

# ---- LaTeX-safe replacements -------------------------------------------
# ai-tells.EmDashUsage flags "--", which is the legitimate LaTeX en dash
# for ranges (pp. 10--20). Paper.EmDash handles em dashes safely instead.
ai-tells.EmDashUsage = NO
# Semicolons joining related clauses are a mark of skilled academic prose,
# not an AI tell (humanizer_academic pattern 34.4).
ai-tells.SemicolonUsage = NO

# ---- Legitimate academic usage: downgrade to suggestion ----------------
# Moreover/Furthermore/However are standard scholarly connectives; only
# stacking them is a tell (caught by Paper.TransitionRepetition).
ai-tells.FormalTransitions = suggestion
ai-tells.FormalRegister = suggestion
# "In conclusion" is expected at the start of a Conclusion section.
ai-tells.ConclusionMarkers = suggestion
# "as noted above" cross-references are normal in papers.
ai-tells.SelfReference = suggestion
# "X: A Y Approach" paper titles and "Label: sentence" figure captions.
ai-tells.ColonUsage = suggestion
# One "not only ... but also" per paragraph is natural academic prose.
ai-tells.ContrastiveNegation = suggestion

# ---- Possibly-technical vocabulary: warning, the human judges ----------
# "robust optimization", "comprehensive evaluation" can be terms of art.
ai-tells.OverusedVocabulary = warning
ai-tells.OverusedVocabularyVerbs = warning
ai-tells.AIAdjectiveNounPairs = warning
ai-tells.AICompoundPhrases = warning
ai-tells.FillerPhrases = warning
ai-tells.AbsoluteAssertions = warning
# Hedging is required in papers; calibrating it is the skill layer's job.
ai-tells.DefensiveHedges = warning
ai-tells.HollowAcknowledgment = warning

# ---- Rhythm metrics (vendored from ai-tells-experimental): advisory ----
Paper.SentenceLengthVariance = suggestion
Paper.SentenceStartRepetition = suggestion
Paper.TransitionRepetition = suggestion
Paper.ParagraphLengthVariance = suggestion

# Ignore inline math and LaTeX citation/cross-reference machinery
# (citations may carry optional arguments: \citep[see][p.~7]{key}).
TokenIgnores = (\$+[^\n$]+\$+), (\\\([^)]*\\\)), (\\(?:[Cc]ite[tp]?|parencite|textcite|autocite|ref|eqref|autoref|[Cc]ref|pageref|label)\*?(?:\[[^\]]*\])*\{[^}]*\}), (\\[a-zA-Z@]+)
# Ignore display-math environments and \[...\] display math entirely.
BlockIgnores = (?s)\\begin\{(?:equation|align|gather|multline|eqnarray|math|displaymath)\*?\}.*?\\end\{(?:equation|align|gather|multline|eqnarray|math|displaymath)\*?\}, (?s)\\\[.*?\\\]
