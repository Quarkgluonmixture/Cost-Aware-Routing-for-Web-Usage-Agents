[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["p79*"]

[project]
name = "p79"
version = "0.2.0"
description = "Project 79: Cost-Aware Routing for Web Usage Agents with VisualWebArena + Qwen3-VL-4B"
readme = "README.md"
requires-python = ">=3.9"  # Lowered for Myriad compat (pytorch/2.1.0 module ships Python 3.9.6); code uses `from __future__ import annotations` so newer type syntax still works
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.42.0",
    "qwen-vl-utils",
    "pillow",
    "numpy",
    "pyyaml",
    "openai>=1.0.0",
]

[project.optional-dependencies]
analysis = [
    "pandas",
    "matplotlib",
    "scipy",
]
mechanistic = [
    "scikit-learn",
    "matplotlib",
    "numpy",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
run-experiment = "p79.cli.run_experiment:main"
analyze-experiment = "p79.cli.analyze_experiment:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
