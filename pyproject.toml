[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["p79*"]

[project]
name = "p79"
version = "0.2.0"
description = "Project 79: Cost-Aware Routing for Web Usage Agents with VisualWebArena + Qwen3-VL-4B"
readme = "README.md"
requires-python = ">=3.9"  # Lowered for Myriad compat (pytorch/2.1.0 module ships Python 3.9.6); code uses `from __future__ import annotations` so newer type syntax still works
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.42.0",
    "qwen-vl-utils",
    # B-155 (/stress A1.2 v8 Claude A7, 2026-05-16): pinned ≥10 for
    # ``Image.Resampling.LANCZOS`` enum API used by image_utils.py; bounded
    # <12 so a future major release cannot silently change resize kernel
    # behaviour. Bit-identical cross-host image bytes require uniform PIL
    # across DGX / Condenser / Myriad — pip install -e . enforces uniform
    # version when the venv is built from this pyproject.
    "pillow>=10.0,<12.0",
    "numpy",
    "pyyaml",
    "openai>=1.0.0",
]

[project.optional-dependencies]
analysis = [
    "pandas",
    "matplotlib",
    "scipy",
]
mechanistic = [
    "scikit-learn",
    "matplotlib",
    "numpy",
]
dev = [
    "pytest>=7.0.0",
]
# /stress A1.12 P1-8 fix (2026-05-16): aggregate extras for `make test`
# paper-grade CI. `[analysis]` extras (pandas/matplotlib/scipy) are
# required to exercise analyze_run end-to-end; without them ~6 test files
# silently `pytest.importorskip`. The `[test]` aggregate keeps `make test`
# honest by making pandas/matplotlib/scipy first-class test deps.
test = [
    "pytest>=7.0.0",
    "pandas",
    "matplotlib",
    "scipy",
]

[project.scripts]
run-experiment = "p79.cli.run_experiment:main"
analyze-experiment = "p79.cli.analyze_experiment:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# /stress A1.12 P1-4 fix (2026-05-16): minimal hygiene flags.
# - `--strict-markers` fails on typo'd mark (so `@pytest.mark.local_dat` is
#   caught before silently always-running);
# - `-ra` shows short summary of (a)ll non-pass outcomes, complementing the
#   `Makefile test:` target where `-x` was removed in the same batch so full
#   failure picture surfaces (vs old fail-fast hiding remaining 4/5 failures).
# - `-rs` reports skipped tests with reason (so `pytest.importorskip("pandas")`
#   silent skip becomes visible — paper-grade analysis path can't silently
#   un-execute).
# `markers` registry below pre-declares custom marks so strict-markers passes.
addopts = "--strict-markers -ra -rs"
markers = [
    "local_data: tests that depend on local results/* and run_manifest.yaml (skipped by default in CI; run with `pytest -m local_data`)",
    "external: tests that exercise external systems (VWA browser_env, evaluator_router, live docker); skipped by default",
]
