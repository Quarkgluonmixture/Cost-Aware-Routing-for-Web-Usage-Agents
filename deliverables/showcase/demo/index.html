<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Look, read, or both?</title>
<!--
  Three-lane replay for the 16 Sep showcase board.
  Data: data.js (generated by build_demo_data.py) + frames/[task]/[lane]/*.png
  Opens by double-click, no server needed. See build_demo_data.py for why the data
  is a script global rather than fetched JSON.

  KEEP THE FULL html/head/body SKELETON. An earlier version omitted it (a bare
  doctype + meta + style + content is valid HTML5 and renders fine), and it worked
  under `python -m http.server` — but VS Code's Live Server injects its reload client
  by locating the closing body tag. With none to find, the injection landed inside
  the script block and split it in half, so the second half rendered as visible
  source text. (Do not write that tag literally in this comment either: the injector
  matches the string, not the parse tree, and would aim at the comment.) The page looked catastrophically broken in the one environment it is actually
  opened in, and perfectly fine in every environment it was tested in.
-->
<style>
:root{
  /* Same three colours as the poster and the thesis figures:
     blue = image only, orange = text only, green = text + image. */
  --look:#1F5FD6; --read:#E8720C; --both:#14855F;
  --fail:#C2352B; --ink:#141E41; --muted:#5D6787;
  --hair:#DDE3F2; --fill:#F7F9FD;
}
*{box-sizing:border-box}
/* The page is looked at full-screen on a board laptop, so it claims the whole
   viewport and gives every spare pixel to the frames rather than leaving a band of
   white under the lanes. Everything except .lanes is fixed height; .lanes takes the
   remainder and each stage grows into it. */
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);display:flex;flex-direction:column;
     overflow:hidden;
     font:16px/1.45 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:14px 26px 10px;border-bottom:1px solid var(--hair);flex:none}
h1{margin:0;font:700 28px/1.2 Georgia,serif;letter-spacing:.1px}
.sub{margin-top:5px;color:var(--muted);font-size:15.5px}
.tabs{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.tab{padding:7px 15px;border:1.5px solid var(--hair);border-radius:999px;
     background:#fff;cursor:pointer;font:600 14px Arial;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--ink);color:var(--ink);background:var(--fill)}
.taskbar{padding:11px 26px 0;flex:none}
.intent{font:600 23px/1.3 Georgia,serif;color:var(--ink)}
.intent .q{color:var(--muted);font-weight:400}
.caption{margin-top:6px;font:16px Arial;color:var(--muted)}
.caption b{color:var(--ink);font-weight:700}
/* Frames are as wide as three columns allow, so extra height cannot make them bigger;
   the surplus goes to the reasoning box (.think grows). The reverse case matters too:
   inside the talk deck's iframe, or on a 16:10 laptop with browser chrome, the viewport
   is ~800px and the lane no longer fits — then the STAGE shrinks first (flex-shrink)
   and the frame follows via max-height + aspect-ratio, narrower and centred, instead
   of the whole lane overflowing the row and covering the pick line above it
   (笔记 §507.5, seen 2026-09-11 in the deck at 1600×900). */
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:13px 26px 0;
       flex:1;min-height:0;align-items:stretch}
.lane{border:1.5px solid var(--hair);border-radius:11px;overflow:hidden;
      display:flex;flex-direction:column;background:#fff;min-height:0}
.lane[data-done="1"]{opacity:.97}
.lh{display:flex;align-items:baseline;gap:9px;padding:9px 13px;color:#fff}
.lane.LOOK .lh{background:var(--look)} .lane.READ .lh{background:var(--read)}
.lane.BOTH .lh{background:var(--both)}
.lh b{font:700 18px Arial;letter-spacing:.4px}
.lh .what{font-size:13.5px;opacity:.93}
.lh .verdict{margin-left:auto;font:700 15px Arial}
/* Three 16:9 frames side by side occupy a 48:9 strip, so on a 16:9 screen the
   height is never the binding constraint — the leftover would become letterbox black
   above and below each frame, which is what read as "the bottom is empty". The stage
   therefore takes only the height its frame needs, and the surplus goes to the
   reasoning text, which is content worth enlarging at board distance. */
.stage{flex:0 1 auto;min-height:0;background:#0d1220;overflow:hidden;display:flex;justify-content:center}
.frame{position:relative;aspect-ratio:1280/720;width:100%;max-height:100%;overflow:hidden}
/* Every frame of the task is mounted at once and cross-faded by opacity. Swapping a
   single <img>'s src re-fetches and re-decodes it, which blanks the element for a
   frame or two — that flicker is what a visitor reads as "broken", and it is worst on
   exactly the step transitions this demo is made of. */
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
           opacity:0;transition:opacity .26s ease}
.frame img.on{opacity:1}
.lane.LOOK .cur,.lane.LOOK .fx,.lane.LOOK .fx2,.lane.LOOK .fx3,.lane.LOOK .tag{color:var(--look)}
.lane.READ .cur,.lane.READ .fx,.lane.READ .fx2,.lane.READ .fx3,.lane.READ .tag{color:var(--read)}
.lane.BOTH .cur,.lane.BOTH .fx,.lane.BOTH .fx2,.lane.BOTH .fx3,.lane.BOTH .tag{color:var(--both)}
/* Overlay geometry is a percentage of the 1280x720 viewport the agent saw, so it
   stays correct at any column width. */
.mk{position:absolute;pointer-events:none;opacity:0;
    transition:opacity .3s ease,left .9s var(--ease),top .9s var(--ease),
               width .9s var(--ease),height .9s var(--ease)}
.mk.on{opacity:1}

/* ---- the pointer -------------------------------------------------------------
   A step is not a slideshow cut: the agent moved somewhere and acted. The pointer
   travels to the target over ~0.9s on an ease-in-out curve (fast in the middle,
   settling at the end — roughly how a hand moves), the click fires, and only THEN
   does the frame change. Showing the frame first would put the effect before the
   cause, which is exactly what made the earlier version read as a flicker. */
:root{--ease:cubic-bezier(.33,.02,.2,1)}
.cur{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-2px 0 0 -2px;
     pointer-events:none;z-index:6;opacity:0;
     transition:opacity .35s ease,left .9s var(--ease),top .9s var(--ease),
                transform .12s ease}
.cur.on{opacity:1}
.cur.press{transform:scale(.74) rotate(-4deg)}
.cur svg{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}

/* click / type / select land as an expanding ring; scroll gets its own glyph */
/* Two rings, the second delayed, so the click reads as a beat rather than a blink —
   at board distance a single fast ring is easy to miss between glances. */
.fx{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
    pointer-events:none;z-index:5;opacity:0;border:4px solid currentColor;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.9),inset 0 0 0 1.5px rgba(255,255,255,.9)}
.fx.go{animation:ring .82s cubic-bezier(.15,.6,.3,1)}
@keyframes ring{
  0%{opacity:1;transform:scale(.3)}
  55%{opacity:.75}
  100%{opacity:0;transform:scale(6.2)}}
.fx2{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
     pointer-events:none;z-index:5;opacity:0;border:3px solid currentColor}
.fx2.go{animation:ring2 .82s cubic-bezier(.15,.6,.3,1) .14s}
@keyframes ring2{
  0%{opacity:.85;transform:scale(.3)}
  100%{opacity:0;transform:scale(4.4)}}
/* A solid flash marks the instant of contact, but it must not hide WHAT was clicked —
   an opaque disc over the target defeats the point of drawing the target at all. Kept
   translucent, small and short: visible as a pulse, transparent to the element under it. */
.fx3{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
     pointer-events:none;z-index:5;opacity:0;background:currentColor}
.fx3.go{animation:flash .3s ease-out}
@keyframes flash{0%{opacity:.5;transform:scale(.15)}100%{opacity:0;transform:scale(1.9)}}

/* the action word flashes where it happened, so a visitor reads WHAT was done
   without looking away from the frame */
/* The lane tints this element via `color`, and the background reads that same
   currentColor — so the label's own text CANNOT use `color`, or it comes out the
   same shade as the plate behind it and vanishes (it did: textContent said "click"
   while the screen showed a blank orange bar). The text therefore lives in child
   elements that set their own colour. */
.tag{position:absolute;z-index:7;padding:4px 11px;border-radius:7px;
     background:currentColor;font:700 15px Arial;letter-spacing:.3px;white-space:nowrap;
     box-shadow:0 0 0 2px rgba(255,255,255,.92),0 3px 9px rgba(0,0,0,.35);
     transform:translate(-50%,-190%);opacity:0;pointer-events:none}
.tag.go{animation:tagpop 1.15s ease-out}
@keyframes tagpop{
  0%{opacity:0;transform:translate(-50%,-150%) scale(.85)}
  18%{opacity:1;transform:translate(-50%,-200%) scale(1)}
  75%{opacity:1;transform:translate(-50%,-205%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-240%) scale(1)}}
/* target near the top edge: the label drops below it rather than off the stage */
.tag.below.go{animation:tagpopdown 1.15s ease-out}
@keyframes tagpopdown{
  0%{opacity:0;transform:translate(-50%,60%) scale(.85)}
  18%{opacity:1;transform:translate(-50%,110%) scale(1)}
  75%{opacity:1;transform:translate(-50%,115%) scale(1)}
  100%{opacity:0;transform:translate(-50%,150%) scale(1)}}
.tag b{color:#fff;font-weight:700}
.tag i{color:#fff;opacity:.85;font-weight:400;font-style:normal}
.mk.box{border:3px solid #fff;border-radius:3px;
        box-shadow:0 0 0 2.5px currentColor,0 0 13px rgba(0,0,0,.55)}
.lane.BOTH .mk.box{border-width:4px;animation:pulse 1.5s ease-out infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 3px currentColor,0 0 0 3px rgba(20,133,95,.55),0 0 13px rgba(0,0,0,.5)}
  70%{box-shadow:0 0 0 3px currentColor,0 0 0 15px rgba(20,133,95,0),0 0 13px rgba(0,0,0,.5)}
  100%{box-shadow:0 0 0 3px currentColor,0 0 0 3px rgba(20,133,95,0),0 0 13px rgba(0,0,0,.5)}}
/* No dimming layer. An earlier build dimmed the SoM lane to make its highlight stand
   out among the numbered boxes; measured on the rendered page that cost it 36% of its
   brightness (212 -> 135) while LOOK and READ stayed at 212, and at board distance it
   simply read as "the picture is dark". The numbers ARE what this lane is showing, so
   the highlight is carried by weight and motion instead. */
.mk.point{width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;
          border:3.5px solid currentColor;box-shadow:0 0 0 2.5px #fff,0 0 13px rgba(0,0,0,.55)}
.mk.point::after{content:"";position:absolute;inset:11px;border-radius:50%;background:currentColor}
.mk .eid{position:absolute;top:-15px;left:-15px;min-width:30px;height:30px;padding:0 8px;
         border-radius:15px;background:var(--both);color:#fff;
         font:700 16px/30px Arial;text-align:center;letter-spacing:.2px;
         box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.45)}
.lane.LOOK .mk{color:var(--look)} .lane.READ .mk{color:var(--read)}
.lane.BOTH .mk{color:var(--both)}
.pending{position:absolute;inset:0;display:grid;place-items:center;
         background:rgba(17,17,17,.72);color:#fff;font:600 15px Arial;letter-spacing:.3px}
/* ONE fixed height for all three lanes. With min/max the box sized itself to its own
   text — READ's five-line reason next to LOOK's two — so the lanes came out different
   heights and, being centre-aligned, sat at different vertical offsets. Three panels
   meant to be compared must share a baseline, so the box is a fixed height that scales
   with the viewport and scrolls if a reason overruns it. */
.think{padding:14px 16px;flex:1 0 clamp(118px,13.5vh,205px);min-height:0;overflow:auto;
       font-size:16.5px;line-height:1.5;
       color:#2b3555;border-top:1px solid var(--hair);background:var(--fill);
       transition:opacity .18s ease}
.think.swap{opacity:.25}
.think .none{color:var(--muted);font-style:italic}
.think .did{display:block;margin-top:7px;color:var(--ink);font:600 15.5px Arial}
.foot{display:flex;align-items:center;gap:11px;padding:10px 15px;border-top:1px solid var(--hair);
      font:14px Arial;color:var(--muted);flex:none}
.foot .act{font:600 12.5px "Consolas",monospace;padding:2px 7px;border-radius:5px;
           background:var(--fill);border:1px solid var(--hair);color:var(--ink)}
.foot .usd{margin-left:auto;font:700 17px Arial;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--hair)} .bar i{display:block;height:100%;background:currentColor;transition:width .26s ease}
.lane.LOOK .bar{color:var(--look)} .lane.READ .bar{color:var(--read)}
.lane.BOTH .bar{color:var(--both)}
.ok{color:#eafff5} .no{color:#ffe6e3}
footer{display:flex;align-items:center;gap:15px;padding:10px 26px 12px;color:var(--muted);font-size:13px;flex:none}
button{padding:7px 14px;border:1.5px solid var(--hair);border-radius:8px;background:#fff;
       cursor:pointer;font:600 13.5px Arial;color:var(--ink);white-space:nowrap}
button:hover{border-color:var(--ink)}
kbd{border:1px solid var(--hair);border-bottom-width:2.5px;border-radius:5px;padding:1px 6px;
    font:12px Consolas,monospace;background:var(--fill)}
/* the provenance block takes the leftover width and wraps inside it, so the
   control buttons never get squeezed onto two lines */
.prov{margin-left:auto;text-align:right;line-height:1.4;flex:1 1 420px;min-width:0;font-size:12px}

/* ---- the three meters ---------------------------------------------------------
   Each row is scaled to the largest FINAL value among this task's three lanes, so the
   longest lane fills its row and the other two are read against it: a lane that burns
   $0.10 on a failure has to look four times longer than one that solves it for $0.025.
   The CO2e row is drawn as a range — solid up to the low end, pale up to the high end —
   because it is an estimate; cost and time are recorded values and get one bar. */
.meters{display:grid;gap:5px;padding:8px 15px 10px;border-top:1px solid var(--hair);flex:none}
.m{display:grid;grid-template-columns:4.4em 1fr 8.4em;align-items:center;gap:10px;
   font:700 13px Arial;color:var(--muted);letter-spacing:.2px}
.m .mb{position:relative;height:11px;border-radius:6px;background:var(--fill);
       border:1px solid var(--hair);overflow:hidden}
.m .mb i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;transition:width .26s ease}
.lane.LOOK .mb i{background:var(--look)} .lane.READ .mb i{background:var(--read)}
.lane.BOTH .mb i{background:var(--both)}
.m .mb i.hi{opacity:.3}
.m .mv{font:700 15.5px Arial;color:var(--ink);text-align:right;
       font-variant-numeric:tabular-nums;white-space:nowrap}
.m.co2 .mv{font-size:14.5px}

/* ---- the learned choice -------------------------------------------------------
   One line under the caption says which view a learned choice picked, and the picked
   lane wears a ring: green if that lane solved the task in this run, red if it did
   not. The outcome is shown from the first frame, like each lane's own verdict — a
   visitor glancing at the board for three seconds should get the whole sentence. */
.pickline{margin-top:6px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
          font:16px Arial;color:var(--ink)}
.pickline .arr{font:700 18px Arial}
.pickline .fine{color:var(--muted);font-size:13.5px}
.pickline .res{font-weight:700;padding:2px 10px;border-radius:999px}
.pickline .res.ok{background:#E2F3EB;color:var(--both)}
.pickline .res.no{background:#FBE5E3;color:var(--fail)}
.pickline .res.mixed{background:var(--fill);color:var(--ink);border:1px solid var(--hair)}
.lane.chosen.won{border-color:var(--both);box-shadow:0 0 0 3px var(--both)}
.lane.chosen.lost{border-color:var(--fail);box-shadow:0 0 0 3px var(--fail)}
.lh .pickt{font:700 12.5px Arial;background:#fff;color:var(--ink);padding:2px 9px;
           border-radius:999px;white-space:nowrap}
/* ---- live tab ---- */
.tab.live{border-style:dashed;color:var(--ink)}
.liveform{display:flex;gap:10px;align-items:center}
.liveform input{flex:1;min-width:0;padding:9px 14px;border:1.5px solid var(--ink);border-radius:10px;
                font:600 20px Georgia,serif;color:var(--ink)}
.liveform button{padding:10px 16px;font-size:15px}
.liveform #liverun{background:var(--ink);border-color:var(--ink);color:#fff}
button:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;background:var(--fill);font:13.5px Arial}
.livestat{color:var(--muted);font-size:14.5px}
.pending[hidden]{display:none}
.idlecap{position:absolute;left:10px;bottom:10px;z-index:8;padding:5px 11px;border-radius:7px;
         background:rgba(20,30,65,.85);color:#fff;font:600 13.5px Arial;pointer-events:none}
.idlecap[hidden]{display:none}
/* live: the picked lane waits in a neutral ring until the visitor judges its answer */
.lane.chosen{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
.lane.chosen.even{border-color:var(--muted);box-shadow:0 0 0 3px var(--muted)}
.judge{display:inline-flex;gap:5px;margin-left:9px}
.judge button{padding:1px 10px;border-radius:6px;border:1.5px solid rgba(255,255,255,.75);
              background:rgba(255,255,255,.14);color:#fff;font:700 14px Arial}
.judge button.sel{background:#fff;color:var(--ink);border-color:#fff}
.livepick{flex-basis:100%;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.livepick:empty{display:none}
@media(max-width:1000px){.lanes{grid-template-columns:1fr}}
</style>

</head>
<body>
<header>
  <h1>Look, read, or both?</h1>
  <div class="sub" id="sub">The same task, replayed in three representations. Each lane is
    <b>one recorded run</b> — screenshots and clicks are the agent's own; nothing is live.</div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>
<div class="taskbar">
  <div class="intent" id="intent"></div>
  <div class="caption" id="caption"></div>
  <div class="pickline" id="pickline"></div>
</div>
<div class="lanes" id="lanes"></div>
<footer>
  <button id="play">Pause</button>
  <button id="prev">◀ Step</button>
  <button id="next">Step ▶</button>
  <span><kbd>←</kbd><kbd>→</kbd> step · <kbd>space</kbd> play/pause · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> task · <kbd>4</kbd> try your own</span>
  <span class="prov" id="prov"></span>
</footer>

<script src="data.js"></script>
<script>
// Frame source. build_portable.py inlines every frame as a data URI under
// window.FRAMES; without it the relative paths under frames/ are used as-is, so the
// served copy and the single-file copy run identical code.
const SRC = p => (window.FRAMES && window.FRAMES[p]) || p;

const WHAT = {LOOK:"screenshot only", READ:"text tree only", BOTH:"marked screenshot"};
const ORDER = ["LOOK","READ","BOTH"];
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const SUB_REPLAY = $("#sub").innerHTML;       // restored when leaving the live tab
// Two uses of one page (ROADMAP.md D2). The board copy opens bare: it autoplays and
// loops through the three tasks. The talk copy opens as `?task=130&autoplay=0`: it
// lands on that task's first step, plays nothing by itself and holds the finished
// state instead of rolling over, so the arrow keys are the only thing that moves it.
const Q = new URLSearchParams(location.search);
const TALK = Q.get("autoplay") === "0";
// task ids are compared as strings: DEMO_TASKS may hold "130" or 130 depending on the build
const TASK0 = window.DEMO_TASKS.find(t => String(t) === Q.get("task")) ?? window.DEMO_TASKS[0];
let task = TASK0, cursor = 0, playing = !TALK, timer = null;
let EL = {};                                  // lane -> live element refs, built once per task

const maxLen = t => Math.max(...ORDER.map(k => window.DEMO[t].lanes[k].frames.length));

// Decode every frame up front. 82 images / 15 MB total: cheap once, and it removes
// the one thing that still stutters after the DOM stops being rebuilt.
(function preload(){
  for (const t of window.DEMO_TASKS)
    for (const k of ORDER)
      for (const f of window.DEMO[t].lanes[k].frames) new Image().src = SRC(f.img);
})();

function tabs(){
  $("#tabs").innerHTML = "";
  window.DEMO_TASKS.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(mode === "replay" && t === task));
    const o = window.DEMO[t].lanes;
    b.innerHTML = `task ${t} &nbsp;` + ORDER
      .map(k => `<span style="color:var(--${k.toLowerCase()})">${o[k].success ? "✓" : "✗"}</span>`).join("");
    b.onclick = () => go(t);
    $("#tabs").appendChild(b);
  });
  // the fourth tab: a task typed at the board, run live in all three views
  const lv = document.createElement("button");
  lv.className = "tab live"; lv.setAttribute("role", "tab");
  lv.setAttribute("aria-selected", String(mode === "live"));
  lv.textContent = "✎ try your own";
  lv.onclick = liveTab;
  $("#tabs").appendChild(lv);
}

// The pick is read from a fold-held-out replay: the router that made it never saw
// this task. Its colour is RELATIVE to the other lanes (笔记 §506.10, decision 1A): a
// pick is green only when the picked view was the ONLY one that solved the task. When
// another view solved it too, the choice did not matter — grey, and the line names the
// cheaper view. When the pick failed and another view solved it — red, and the line says
// who got it. All failed — grey. Colouring the picked lane by its own outcome alone read
// as "the router was right" whenever every view was right, which is exactly the reading
// the poster's always-cheapest comparison exists to prevent.
function verdict(picked, solved, cost){
  const others = ORDER.filter(k => k !== picked), ok = others.filter(k => solved[k]);
  if (solved[picked]){
    if (!ok.length) return {cls:"won", res:"ok", text:"✓ right — the only view that was"};
    const cheaper = ok.filter(k => cost[k] < cost[picked]);
    const name = (cheaper.length ? cheaper : ok).join(" and ");
    return {cls:"even", res:"mixed", text: cheaper.length
              ? `right — but so was ${name}, for less: the choice didn't matter`
              : `right — but so was ${name}: the choice didn't matter`};
  }
  if (ok.length) return {cls:"lost", res:"no", text:`✗ wrong — ${ok.join(" and ")} got it`};
  return {cls:"even", res:"mixed", text:"wrong — but so was every view"};
}
const replayVerdict = d => d.pick.lane ? verdict(d.pick.lane,
    Object.fromEntries(ORDER.map(k => [k, d.lanes[k].success])),
    Object.fromEntries(ORDER.map(k => [k, d.lanes[k].cost]))) : null;
function pickLine(d){
  const p = d.pick;
  let html = '<span class="arr">➜</span><span><b>A learned choice</b> ' +
             '<span class="fine">(trained without this task)</span> picked ';
  if (p.lane){
    const v = replayVerdict(d);
    html += `<b style="color:var(--${p.lane.toLowerCase()})">${p.lane}</b></span>` +
            `<span class="res ${v.res}">${v.text}</span>`;
  } else {
    // A view that is not one of the three lanes: report its own recorded runs, all
    // of them, because one run of a view is exactly what a rerun can flip.
    const ok = p.runs.filter(r => r.success).length, n = p.runs.length;
    const rec = n === 2 ? (ok === 2 ? "✓ in both of its recorded runs" : ok === 0
                  ? "✗ in both of its recorded runs" : "✓ in one recorded run, ✗ in the other")
                        : `✓ in ${ok} of ${n} recorded runs`;
    html += `a fourth view, not shown here — <b>${esc(p.name)}</b></span>` +
            `<span class="res mixed">${rec}</span>`;
  }
  $("#pickline").innerHTML = html;
}

let SCALE = {usd:1, sec:1, co2:1};

// Lane furniture shared by the replay and the live tab, so the two cannot drift
// apart: everything drawn over the frame, and everything below it.
const OVERLAY = `
        <div class="mk box"><span class="eid"></span></div>
        <div class="mk point"></div>
        <div class="fx"></div><div class="fx2"></div><div class="fx3"></div><div class="tag"></div>
        <div class="cur"><svg width="26" height="26" viewBox="0 0 26 26">
          <path d="M3 2 L3 20 L8 15.5 L11.3 22.6 L14.6 21 L11.4 14.2 L18 14 Z"
                fill="#fff" stroke="#141E41" stroke-width="1.8" stroke-linejoin="round"/></svg></div>`;
const BELOW = `
      <div class="think"></div>
      <div class="foot"><span class="act">—</span><span class="pos"></span></div>
      <div class="meters">
        <div class="m usd"><span>cost</span><span class="mb"><i></i></span><span class="mv"></span></div>
        <div class="m sec"><span>time</span><span class="mb"><i></i></span><span class="mv"></span></div>
        <div class="m co2" title="Estimated, not measured: the model runs in a remote datacentre. Output tokens × a per-token energy measured on this model, input tokens × an inferred one (no measurement exists), × datacentre overhead × UK grid. Image input is not modelled separately."><span>CO₂e ≈</span><span class="mb"><i class="hi"></i><i class="lo"></i></span><span class="mv"></span></div>
      </div>
      <div class="bar"><i></i></div>`;
function refs(el){
  const q = s => el.querySelector(s);
  return {imgs:[...el.querySelectorAll(".frame img")], box:q(".mk.box"), eid:q(".eid"),
          point:q(".mk.point"), cur:q(".cur"), fx:q(".fx"), fx2:q(".fx2"), fx3:q(".fx3"),
          tag:q(".tag"), think:q(".think"), act:q(".act"), pos:q(".pos"),
          mUsd:q(".m.usd"), mSec:q(".m.sec"), mCo2:q(".m.co2"), bar:q(".bar i"), lane:el};
}

// Build the three lanes for a task ONCE, mounting every frame stacked. After this the
// only per-step work is toggling classes and writing text — no node is created or
// destroyed, so nothing can blank out mid-transition.
function mount(){
  const d = window.DEMO[task];
  $("#sub").innerHTML = SUB_REPLAY;
  $("#intent").innerHTML = '<span class="q">Task:</span> ' + esc(d.intent);
  $("#caption").innerHTML = esc(d.caption);
  pickLine(d);
  // each meter row is scaled to the largest final value among this task's lanes
  const top = f => Math.max(...ORDER.map(k => f(d.lanes[k]))) || 1;
  SCALE = {usd: top(L => L.cost), sec: top(L => L.seconds), co2: top(L => L.co2[1])};
  const box = $("#lanes"); box.innerHTML = ""; EL = {};
  const V = replayVerdict(d);
  ORDER.forEach(k => {
    const L = d.lanes[k];
    const chosen = d.pick.lane === k;
    const el = document.createElement("div");
    el.className = "lane " + k + (chosen ? " chosen " + V.cls : "");
    el.innerHTML = `
      <div class="lh"><b>${k}</b><span class="what">${WHAT[k]}</span>
        ${chosen ? '<span class="pickt">➜ learned choice</span>' : ""}
        <span class="verdict ${L.success ? "ok" : "no"}">${L.success ? "✓ solved" : "✗ failed"} · ${L.steps} steps</span></div>
      <div class="stage"><div class="frame">
        ${L.frames.map((f,i) => `<img src="${SRC(f.img)}" alt="${k} step ${f.step}" data-i="${i}">`).join("")}${OVERLAY}
      </div></div>${BELOW}`;
    box.appendChild(el);
    EL[k] = refs(el);
  });
  $("#prov").innerHTML = ORDER.map(k => `${k}: <code>${d.lanes[k].run}</code>`).join(" · ") +
    "<br>time = each run's recorded wall-clock · CO₂e ≈ estimated from tokens, not measured" +
    "<br>learned choice: fold-held-out replay of the project's learned router · its ring is coloured against the other two views, not on its own";
}

const pct = v => (100 * Math.max(0, Math.min(1, v))) + "%";
function meter(el, frac, text, loFrac){
  if (loFrac == null) el.querySelector(".mb i").style.width = pct(frac);
  else { el.querySelector(".mb i.hi").style.width = pct(frac);
         el.querySelector(".mb i.lo").style.width = pct(loFrac); }
  el.querySelector(".mv").textContent = text;
}
const fmtSec = s => s < 59.5 ? `${Math.round(s)} s`
  : `${Math.floor(s / 60)} min ${String(Math.round(s % 60)).padStart(2, "0")} s`;
const sig = v => v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1) : v.toPrecision(2);
const fmtG = ([lo, hi]) => `${sig(lo)}–${sig(hi)} g`;

// A step plays in three beats so that cause precedes effect:
//   1. MOVE   the pointer travels to this step's target (~0.9s, ease-in-out)
//   2. ACT    the click ring fires and the action word flashes at that spot
//   3. RESULT the frame cross-fades to the page the action produced
// Beat 3 is why the frame index shown is `i` while the pointer aims at frame `i`'s
// target and then advances: the screenshot stored with a step is the page BEFORE the
// action, so revealing the next one on the click is the honest ordering, not a flourish.
const T_MOVE = 950, T_ACT = 520, T_HOLD = 1250;
const STEP_MS = T_MOVE + T_ACT + T_HOLD;
let beats = [];

const clearBeats = () => { beats.forEach(clearTimeout); beats = []; };
const at = (ms, fn) => beats.push(setTimeout(fn, ms));
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

// Where the pointer should sit for a frame: the centre of a box, the point itself,
// or — for a step with no target, e.g. scroll — wherever it already is.
function aim(m){
  if (!m) return null;
  return m.kind === "box" ? {x:(m.x + m.w/2)/12.8, y:(m.y + m.h/2)/7.2}
                          : {x:m.x/12.8, y:m.y/7.2};
}

function paint(opts){
  const anim = !(opts && opts.instant);
  clearBeats();
  const d = window.DEMO[task];
  ORDER.forEach(k => {
    const L = d.lanes[k], e = EL[k];
    const i = Math.min(cursor, L.frames.length - 1);
    const f = L.frames[i], done = cursor > L.frames.length - 1;

    // beat 0 — the frame this action is about, plus its text
    e.imgs.forEach((im, j) => im.classList.toggle("on", j === i));
    setText(e, L, f, i);

    const m = f.mark, a = aim(m);
    const showId = k === "BOTH" && m && m.id != null;
    placeMark(e, m, showId);

    if (done){ e.cur.classList.remove("on"); return; }

    // beat 1 — travel. Without `anim` the pointer is teleported (manual stepping
    // backwards, or a task switch), so it never crawls across a stale frame.
    if (a){
      e.cur.classList.add("on");
      if (!anim) e.cur.style.transition = "none";
      e.cur.style.left = a.x + "%"; e.cur.style.top = a.y + "%";
      if (!anim) { void e.cur.offsetWidth; e.cur.style.transition = ""; }
    }
    if (!anim) return;

    // beat 2 — the act, at the place the pointer just reached
    at(T_MOVE, () => strike(e, m, a, f.action, showId));

    // beat 3 — the page the action produced
    if (i + 1 < L.frames.length)
      at(T_MOVE + T_ACT, () => e.imgs.forEach((im, j) => im.classList.toggle("on", j === i + 1)));
  });
}

// Draw a step's target: a box (READ and BOTH, BOTH with its element number) or a
// point (LOOK's click), or nothing for a step without one. Shared with the live tab.
function placeMark(e, m, showId){
  if (m && m.kind === "box"){
    Object.assign(e.box.style, {left:(m.x/12.8)+"%", top:(m.y/7.2)+"%",
                               width:(m.w/12.8)+"%", height:(m.h/7.2)+"%"});
    e.eid.textContent = showId ? m.id : "";
    e.eid.style.display = showId ? "" : "none";
    e.box.classList.add("on"); e.point.classList.remove("on");
  } else if (m && m.kind === "point"){
    Object.assign(e.point.style, {left:(m.x/12.8)+"%", top:(m.y/7.2)+"%"});
    e.point.classList.add("on"); e.box.classList.remove("on");
  } else { e.box.classList.remove("on"); e.point.classList.remove("on"); }
}

// The act itself, where the pointer has just arrived: the rings, the action word and
// a press of the pointer. A step with no target (scroll / finish) only says what it did.
function strike(e, m, a, action, showId){
  if (a){
    ["fx","fx2","fx3"].forEach(n => {
      e[n].style.left = a.x + "%"; e[n].style.top = a.y + "%";
    });
    // Anchor the label to the box's own top/bottom edge, and flip it below when
    // that edge is too close to the top of the stage to fit the label above it.
    const topPct = m.kind === "box" ? m.y/7.2 : a.y;
    const botPct = m.kind === "box" ? (m.y + m.h)/7.2 : a.y;
    const below = topPct < 11;
    e.tag.classList.toggle("below", below);
    e.tag.style.left = a.x + "%";
    e.tag.style.top = (below ? Math.min(botPct, 96) : Math.max(topPct, 4)) + "%";
    e.tag.innerHTML = `<b>${verb(action)}</b>` + (showId ? ` <i>[${m.id}]</i>` : "");
    replay(e.fx, "go"); replay(e.fx2, "go"); replay(e.fx3, "go"); replay(e.tag, "go");
    e.cur.classList.add("press");
    at(T_MOVE + 130, () => e.cur.classList.remove("press"));
  } else {
    // no target (scroll / finish): say so where the pointer stands
    e.tag.style.left = e.cur.style.left || "50%";
    e.tag.style.top = e.cur.style.top || "50%";
    e.tag.innerHTML = `<b>${verb(action)}</b>`;
    replay(e.tag, "go");
  }
}

const VERB = {click:"click", type:"type", scroll:"scroll", select_option:"select",
              goto:"go to", hover:"hover", key_press:"key", finish:"finish", stop:"finish"};
const verb = a => VERB[a] || a || "act";

function setText(e, L, f, i){
  const html = f.thought ? esc(f.thought) : noReason({...f, lane:e.lane.classList[1]});
  // The fade-in is a plain timer, NOT one of the step's beats: paint() cancels
  // pending beats on every step, and when it cancelled this one the text stayed at
  // 25% opacity for good — which is what fast manual stepping at the board produced.
  if (e.think.dataset.h !== html){
    e.think.dataset.h = html;
    e.think.classList.add("swap");
    setTimeout(() => {
      if (e.think.dataset.h !== html) return;       // a newer step already replaced it
      e.think.innerHTML = html; e.think.classList.remove("swap");
    }, 110);
  }
  e.act.textContent = f.action || "—";
  e.pos.textContent = `step ${f.step + 1}/${L.frames.length}`;
  meter(e.mUsd, f.cost_cum / SCALE.usd, "$" + f.cost_cum.toFixed(3));
  meter(e.mSec, f.sec_cum / SCALE.sec, fmtSec(f.sec_cum));
  meter(e.mCo2, f.co2_cum[1] / SCALE.co2, fmtG(f.co2_cum), f.co2_cum[0] / SCALE.co2);
  e.bar.style.width = (100 * (i + 1) / L.frames.length) + "%";
  e.lane.dataset.done = cursor >= L.frames.length - 1 ? "1" : "0";
}

// Some steps carry a tool call with no reasoning text. That is the recording, not a
// gap in it, so the lane says so and shows the action instead of inventing a thought.
function noReason(f){
  const what = f.lane === "BOTH" && f.mark && f.mark.id != null
             ? `${f.action} the element marked [${f.mark.id}]`
             : f.mark ? `${f.action} the highlighted element` : (f.action || "—");
  return '<span class="none">— the agent stated no reason —</span>' +
         `<span class="did">it did: ${esc(what)}</span>`;
}

function go(t){
  if (mode === "live") leaveLive();
  task = t; cursor = 0; tabs(); mount(); paint();
}

// In the talk copy the page may sit inside the deck's iframe. When the presenter
// steps past the held end state (or back past the first step) the demo tells the
// parent, and the deck turns the page — so one pair of arrow keys drives both, and
// the deck never steals a keypress while the demo still has steps to show.
const tellDeck = type => { if (window.parent !== window) window.parent.postMessage({type}, "*"); };
function step(n){
  const back = n < 0, was = cursor;
  cursor += n;
  if (cursor >= maxLen(task) + 2){            // hold the finished state, then loop on
    if (TALK){ cursor = maxLen(task) + 1; tellDeck("demo-next"); return; }   // talk copy: hold, hand over
    const i = window.DEMO_TASKS.indexOf(task);
    go(window.DEMO_TASKS[(i + 1) % window.DEMO_TASKS.length]);
    return;
  }
  if (cursor < 0){ cursor = 0; if (TALK && was === 0) tellDeck("demo-prev"); }
  paint(back ? {instant:true} : undefined);
}
function loop(){ clearInterval(timer); if (playing) timer = setInterval(() => step(1), STEP_MS); }
// stepping belongs to the replay; in the live tab the steps arrive on their own
const manual = n => { if (mode === "live") return;
                      playing = false; $("#play").textContent = "Play"; loop(); step(n); };

$("#next").onclick = () => manual(1);
$("#prev").onclick = () => manual(-1);
$("#play").onclick = () => {
  if (mode === "live") return backToReplay();
  playing = !playing; $("#play").textContent = playing ? "Pause" : "Play"; loop();
};
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;   // typing a task
  if (e.key === "4") return liveTab();
  // space is the replay's play/pause; in the live tab a stray press must not throw the
  // visitor out of their run
  if (mode === "live" && e.key === " "){ e.preventDefault(); return; }
  if (e.key === "ArrowRight") manual(1);
  else if (e.key === "ArrowLeft") manual(-1);
  else if (e.key === " ") { e.preventDefault(); $("#play").click(); }
  else if ("123".includes(e.key)) go(window.DEMO_TASKS[+e.key - 1]);
});

// ---- live: "try your own" ---------------------------------------------------------
// A visitor types a task; live/server.py (on DGX) runs the ordinary agent in all three
// views against the classifieds site and streams each step here. Same lanes, same click
// drawing, same meters as the replay — but NOT scored: a free-text task has no answer
// key, so the page shows what the agent said when it finished and leaves the verdict to
// the visitor. If the server can't be reached the tab says so and the recorded tasks
// keep playing; nothing else on the page depends on it.
const LIVE = (new URLSearchParams(location.search).get("live") || "http://localhost:8799").replace(/\/+$/, "");
const SUGGEST = [
  "Find the cheapest red bicycle listed on this site.",
  "Show me a boat listing whose photo was taken at sunset.",
  "What is the most expensive item in the Electronics category?",
  "Find a blue car for sale under $5,000.",
];
// The live tab stays put. Drifting back to the replay is OFF unless the URL asks for it
// with `?idle=<seconds>` (then any mouse / key / scroll / touch restarts the count).
// It was on by default at first and threw a presenter who was reading a result aloud
// back to task 130 — the user asked for it gone.
const IDLE_SEC = +(new URLSearchParams(location.search).get("idle") || 0);
const IDLE_OFF = !(IDLE_SEC > 0), IDLE_MS = IDLE_SEC * 1000;
let mode = "replay", liveId = null, liveCap = 12, es = null, LEL = {}, LVAL = {}, idleT = null;
["pointermove", "pointerdown", "keydown", "wheel", "touchstart"].forEach(t =>
  addEventListener(t, () => { if (mode === "live" && idleT) armIdle(); }, {passive: true}));

const setStat = h => { const s = $("#livestat"); if (s) s.innerHTML = h; };
function running(on){
  const q = $("#liveq");
  if (!q) return;
  q.disabled = on; $("#liverun").disabled = on; $("#livestop").hidden = !on;
  document.querySelectorAll(".chip").forEach(c => c.disabled = on);
}
function armIdle(){
  clearTimeout(idleT); idleT = null;
  if (IDLE_OFF) return;
  // never while a run is still showing (es open, or steps still queued for display)
  idleT = setTimeout(() => { if (mode === "live" && !es && !pumpT) backToReplay(); }, IDLE_MS);
}
function leaveLive(){
  if (es){ es.close(); es = null; }       // the run itself carries on server-side
  clearTimeout(idleT); clearTimeout(relT); clearInterval(pumpT); mode = "replay";
  $("#play").textContent = playing ? "Pause" : "Play";
}
function backToReplay(){
  playing = !TALK; go(window.DEMO_TASKS[0]);
  $("#play").textContent = playing ? "Pause" : "Play"; loop();
}

function liveTab(){
  mode = "live"; playing = false; clearInterval(timer); clearBeats();
  $("#play").textContent = "Replay";
  tabs();
  $("#sub").innerHTML = "Type a task: the same agent runs it <b>now</b>, in all three views at once. " +
                        "Not scored — you judge the answer.";
  $("#intent").innerHTML = `
    <form class="liveform" id="liveform" autocomplete="off">
      <input id="liveq" maxlength="300" placeholder="Type a task for the agent on this classifieds site…">
      <button type="submit" id="liverun">Run all three</button>
      <button type="button" id="livestop" hidden>Stop</button>
    </form>`;
  $("#caption").innerHTML = '<div class="chips">' +
    SUGGEST.map(s => `<button type="button" class="chip">${esc(s)}</button>`).join("") + "</div>";
  $("#pickline").innerHTML = '<span class="livestat" id="livestat">checking the live server…</span>' +
                             '<span class="livepick" id="livepick"></span>';
  $("#liveform").onsubmit = ev => { ev.preventDefault(); liveRun($("#liveq").value); };
  $("#livestop").onclick = () => fetch(LIVE + "/stop", {method: "POST"}).catch(() => {});
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    $("#liveq").value = c.textContent; $("#liveq").focus(); armIdle(); });
  $("#liveq").oninput = armIdle;
  $("#prov").innerHTML = "live: the same agent, run now in each view against the classifieds site · " +
    "not scored<br>time = real elapsed agent time · CO₂e ≈ estimated from tokens, not measured";
  liveMount(); armIdle();
  const t = window.AbortSignal && AbortSignal.timeout ? {signal: AbortSignal.timeout(3000)} : {};
  fetch(LIVE + "/health", t).then(r => r.json()).then(h => {
    liveCap = h.cap;
    if (h.busy && liveId){ setStat("a run is in progress — showing it"); subscribe(liveId); }
    else setStat(`ready · each view gets up to ${h.cap} steps · the answer is not scored — you judge it`);
  }).catch(() => {
    setStat("live server offline — the three recorded tasks still play");
    $("#liverun").disabled = true;
  });
}

function liveMount(){
  const box = $("#lanes"); box.innerHTML = ""; LEL = {}; LVAL = {};
  ORDER.forEach(k => {
    const el = document.createElement("div");
    el.className = "lane " + k;
    el.innerHTML = `
      <div class="lh"><b>${k}</b><span class="what">${WHAT[k]}</span><span class="verdict"></span></div>
      <div class="stage"><div class="frame">
        <img alt=""><img alt="">${OVERLAY}
        <div class="idlecap">the site's start page · waiting for a task</div>
        <div class="pending" hidden>waiting for a task</div>
      </div></div>${BELOW}`;
    box.appendChild(el);
    const e = LEL[k] = Object.assign(refs(el), {front: 0, pending: el.querySelector(".pending"),
                                                verdict: el.querySelector(".verdict"),
                                                idlecap: el.querySelector(".idlecap")});
    // Before a task, each lane shows the site's start page as that view first sees it
    // (served by the live server), not a black stage. Offline, it falls back to black.
    const im = e.imgs[0];
    im.onload = () => im.classList.add("on");
    im.onerror = () => { e.pending.hidden = false; e.idlecap.hidden = true; };
    im.src = `${LIVE}/idle/${k}.png`;
  });
}

// Each lane shows its own steps as they arrive, without waiting for the others. (A start
// barrier was tried and dropped: holding the first frames until the slowest of three
// cold-starting agents was ready left the screen still for 20–30 s, which read as
// "stuck".) A lane shows at most one step per MIN_GAP, so a burst — a reconnect
// replaying from step 0 — still reads step by step. Between steps the lane's corner says
// what it is doing, with a running count of seconds, so a slow model call never looks
// like a freeze.
const MIN_GAP = 800;
let LQ = {}, LSHOWN = {}, LT = {}, LSTEP = {}, LDONE = {}, ended = false, pumpT = null, relT = null;
function resetQueues(){
  const now = Date.now();
  LQ = {}; LSHOWN = {}; LT = {}; LSTEP = {}; LDONE = {};
  ORDER.forEach(k => { LQ[k] = []; LSHOWN[k] = 0; LT[k] = now; LSTEP[k] = -1; LDONE[k] = false; });
  ended = false; clearInterval(pumpT);
  pumpT = setInterval(pump, 250);
}
function enqueue(k, ev){ LQ[k].push(ev); pump(); }
function pump(){
  const now = Date.now();
  ORDER.forEach(k => {
    if (LQ[k].length && now - LSHOWN[k] >= MIN_GAP){
      const ev = LQ[k].shift(); LSHOWN[k] = now; LT[k] = now;
      if (ev.type === "step"){ LSTEP[k] = ev.step; liveStep(k, ev); }
      else { LDONE[k] = true; liveDone(k, ev); }
    }
    const cap = LEL[k] && LEL[k].idlecap;
    if (!cap) return;
    cap.hidden = LDONE[k];
    if (!LDONE[k])
      cap.textContent = (LSTEP[k] < 0 ? "opening the site · " : `working on step ${LSTEP[k] + 2} · `) +
                        Math.floor((now - LT[k]) / 1000) + " s";
  });
  if (ended && ORDER.every(k => !LQ[k].length)){
    clearInterval(pumpT); pumpT = null; running(false);
    setStat("done · mark each answer ✓ or ✗, then type another task"); armIdle();
    showPick();
  }
}

async function liveRun(q){
  q = (q || "").trim();
  if (q.length < 8){ setStat("type a task first — one sentence is enough"); return; }
  clearTimeout(idleT); running(true); setStat("starting three agents…");
  try {
    const r = await fetch(LIVE + "/run", {method: "POST", headers: {"Content-Type": "application/json"},
                                          body: JSON.stringify({intent: q})});
    const j = await r.json();
    if (r.status === 409){ liveId = j.id; setStat("another run is still going — showing it"); subscribe(j.id); return; }
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    liveId = j.id; liveCap = j.cap; subscribe(j.id);
  } catch (err){ running(false); setStat("could not start: " + esc(String(err.message || err))); }
}

function subscribe(id){
  if (es) es.close();
  liveMount(); resetQueues();
  LPICK = null; JUDGE = {};
  const lp = $("#livepick"); if (lp) lp.innerHTML = "";
  es = new EventSource(`${LIVE}/events/${id}`);
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.type === "hello"){
      liveCap = ev.cap; running(true);
      const q = $("#liveq"); if (q) q.value = ev.intent;
      setStat(`running · each view gets up to ${ev.cap} steps · the answer is not scored — you judge it`);
    } else if (ev.type === "step" || ev.type === "done") enqueue(ev.lane, ev);
    else if (ev.type === "end"){
      es.close(); es = null; ended = true; pump();
    }
  };
  es.onerror = () => {
    if (!es) return;                       // closed on purpose after "end"
    es.close(); es = null; running(false);
    setStat("lost the live server — the run may still be going; reopen this tab to reconnect");
  };
}

// A live step arrives with the screenshot the agent saw BEFORE acting (same ordering as
// the replay): show it, then move the pointer and act. The next step brings the page
// that action produced. The frame swaps only once the new image has decoded, so the lane
// never blanks between steps.
function liveStep(k, ev){
  const e = LEL[k];
  LVAL[k] = ev;
  e.pending.hidden = true;
  const back = e.imgs[1 - e.front];
  back.onerror = null;                     // the idle image's offline fallback no longer applies
  back.onload = () => {
    back.classList.add("on"); e.imgs[e.front].classList.remove("on"); e.front = 1 - e.front;
    const m = ev.mark, a = aim(m), showId = k === "BOTH" && m && m.id != null;
    placeMark(e, m, showId);
    if (a){ e.cur.classList.add("on"); e.cur.style.left = a.x + "%"; e.cur.style.top = a.y + "%"; }
    at(T_MOVE, () => strike(e, m, a, ev.action, showId));
  };
  back.src = LIVE + ev.img;
  e.think.innerHTML = ev.thought ? esc(ev.thought) : noReason({...ev, lane: k});
  e.act.textContent = ev.action || "—";
  e.pos.textContent = `step ${ev.step + 1} · budget ${liveCap}`;
  e.bar.style.width = pct((ev.step + 1) / liveCap);
  liveMeters();
}

// Live meters are scaled to the largest value SO FAR among the three lanes, so the
// comparison holds while the runs are still going.
function liveMeters(){
  const v = ORDER.map(k => LVAL[k]).filter(Boolean);
  const top = g => Math.max(...v.map(g)) || 1;
  const S = {usd: top(x => x.cost_cum), sec: top(x => x.sec_cum), co2: top(x => x.co2_cum[1])};
  ORDER.forEach(k => {
    const x = LVAL[k], e = LEL[k];
    if (!x) return;
    meter(e.mUsd, x.cost_cum / S.usd, "$" + x.cost_cum.toFixed(3));
    meter(e.mSec, x.sec_cum / S.sec, fmtSec(x.sec_cum));
    meter(e.mCo2, x.co2_cum[1] / S.co2, fmtG(x.co2_cum), x.co2_cum[0] / S.co2);
  });
}

function liveDone(k, ev){
  const e = LEL[k];
  const why = {finished: "finished", budget: "stopped at the step budget",
               error: "stopped — the run broke"}[ev.why] || ev.why;
  e.verdict.textContent = `${why} · ${ev.steps} steps`;
  e.cur.classList.remove("on");
  if (!ev.steps){
    e.pending.hidden = false;
    e.pending.textContent = "no page reached — the run broke before its first step";
  }
  if (ev.answer)
    e.think.innerHTML = `<span class="did">answer: ${esc(ev.answer)}</span>` +
                        '<span class="none">not scored — does it answer the task?</span>';
}

// After a live run: which view a learned choice picks for this typed task, and ✓ / ✗
// buttons on every lane so the visitor judges each answer. A typed task has no answer
// key, so the picked lane's ring stays neutral until the visitor marks that lane — then
// it turns green or red. The colour is the visitor's verdict on the router's pick,
// never ours.
let LPICK = null, JUDGE = {};
function showPick(){
  ORDER.forEach(k => {
    const lh = LEL[k].lane.querySelector(".lh");
    if (lh.querySelector(".judge")) return;
    const j = document.createElement("span");
    j.className = "judge";
    j.innerHTML = '<button data-v="1" title="the answer is right">✓</button>' +
                  '<button data-v="0" title="the answer is wrong">✗</button>';
    j.querySelectorAll("button").forEach(b => b.onclick = () => judge(k, b.dataset.v === "1"));
    lh.appendChild(j);
  });
  fetch(`${LIVE}/pick/${liveId}`).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(p => { LPICK = p; renderPick(); })
    .catch(() => { LPICK = null; renderPick(); });
}
function judge(k, ok){
  JUDGE[k] = ok;
  LEL[k].lane.querySelectorAll(".judge button")
    .forEach(b => b.classList.toggle("sel", (b.dataset.v === "1") === ok));
  renderPick();
}
function renderPick(){
  const el = $("#livepick");
  if (!el) return;
  ORDER.forEach(k => {
    LEL[k].lane.classList.remove("chosen", "won", "lost", "even");
    const t = LEL[k].lane.querySelector(".lh .pickt"); if (t) t.remove();
  });
  const p = LPICK;
  if (!p){ el.innerHTML = ""; return; }
  // No vote count on the page: "4 of its 5 models agreed" reads as confidence, and a
  // fold-vote is not one (§506.10 P2). The count stays in the server's JSON for the log.
  let html = '<span class="arr">➜</span><span><b>A learned choice</b> <span class="fine">(trained on ' +
             "recorded runs of this site's tasks, never saw this one · " +
             'difficulty set to the typical value)</span> picked ';
  if (p.lane){
    const e = LEL[p.lane];
    e.lane.classList.add("chosen");
    const badge = document.createElement("span");
    badge.className = "pickt"; badge.textContent = "➜ learned choice";
    e.lane.querySelector(".lh .what").after(badge);
    html += `<b style="color:var(--${p.lane.toLowerCase()})">${p.lane}</b></span>`;
    // Same relative rule as the replay, on the visitor's three verdicts: "right" alone
    // is not a win if a cheaper view was right too. Until all three lanes are marked
    // the ring stays neutral and the line says what is still missing.
    const left = ORDER.filter(k => JUDGE[k] === undefined);
    if (left.length){
      html += `<span class="res mixed">${JUDGE[p.lane] === undefined
                 ? "mark its answer ✓ or ✗"
                 : `mark ${left.join(" and ")} too — did the choice matter?`}</span>`;
    } else {
      const v = verdict(p.lane, JUDGE,
                        Object.fromEntries(ORDER.map(k => [k, LVAL[k] ? LVAL[k].cost_cum : 0])));
      e.lane.classList.add(v.cls);
      html += `<span class="res ${v.res}">${v.text} <span class="fine">(by your verdicts)</span></span>`;
    }
  } else {
    html += (p.fallback ? "its default view, as none of its models was confident — " : "a fourth view, not run here — ") +
            `<b>${esc(p.name)}</b></span>`;
  }
  el.innerHTML = html;
}

tabs(); mount(); paint(); loop();
$("#play").textContent = playing ? "Pause" : "Play";
</script>
</body>
</html>
