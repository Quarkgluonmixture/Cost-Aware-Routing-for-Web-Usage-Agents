<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Look, read, or both?</title>
<!--
  Three-lane replay for the 16 Sep showcase board.
  Data: data.js (generated by build_demo_data.py) + frames/[task]/[lane]/*.png
  Opens by double-click, no server needed. See build_demo_data.py for why the data
  is a script global rather than fetched JSON.

  KEEP THE FULL html/head/body SKELETON. An earlier version omitted it (a bare
  doctype + meta + style + content is valid HTML5 and renders fine), and it worked
  under `python -m http.server` — but VS Code's Live Server injects its reload client
  by locating the closing body tag. With none to find, the injection landed inside
  the script block and split it in half, so the second half rendered as visible
  source text. (Do not write that tag literally in this comment either: the injector
  matches the string, not the parse tree, and would aim at the comment.) The page looked catastrophically broken in the one environment it is actually
  opened in, and perfectly fine in every environment it was tested in.
-->
<style>
:root{
  /* Same three colours as the poster and the thesis figures:
     blue = image only, orange = text only, green = text + image. */
  --look:#1F5FD6; --read:#E8720C; --both:#14855F;
  --fail:#C2352B; --ink:#141E41; --muted:#5D6787;
  --hair:#DDE3F2; --fill:#F7F9FD;
}
*{box-sizing:border-box}
/* The page is looked at full-screen on a board laptop, so it claims the whole
   viewport and gives every spare pixel to the frames rather than leaving a band of
   white under the lanes. Everything except .lanes is fixed height; .lanes takes the
   remainder and each stage grows into it. */
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);display:flex;flex-direction:column;
     overflow:hidden;
     font:16px/1.45 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:14px 26px 10px;border-bottom:1px solid var(--hair);flex:none}
h1{margin:0;font:700 28px/1.2 Georgia,serif;letter-spacing:.1px}
.sub{margin-top:5px;color:var(--muted);font-size:15.5px}
.tabs{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.tab{padding:7px 15px;border:1.5px solid var(--hair);border-radius:999px;
     background:#fff;cursor:pointer;font:600 14px Arial;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--ink);color:var(--ink);background:var(--fill)}
.taskbar{padding:11px 26px 0;flex:none}
.intent{font:600 23px/1.3 Georgia,serif;color:var(--ink)}
.intent .q{color:var(--muted);font-weight:400}
.caption{margin-top:6px;font:16px Arial;color:var(--muted)}
.caption b{color:var(--ink);font-weight:700}
/* Frames are as wide as three columns allow (at 2560px the column is 825px and the
   frame 823px), so extra height cannot make them bigger. Rather than pour the surplus
   into one over-tall reasoning box — which just moves the empty space inside the lane —
   the row is centred and the slack is split evenly above and below. */
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:13px 26px 0;
       flex:1;min-height:0;align-items:center}
.lane{border:1.5px solid var(--hair);border-radius:11px;overflow:hidden;
      display:flex;flex-direction:column;background:#fff;min-height:0}
.lane[data-done="1"]{opacity:.97}
.lh{display:flex;align-items:baseline;gap:9px;padding:9px 13px;color:#fff}
.lane.LOOK .lh{background:var(--look)} .lane.READ .lh{background:var(--read)}
.lane.BOTH .lh{background:var(--both)}
.lh b{font:700 18px Arial;letter-spacing:.4px}
.lh .what{font-size:13.5px;opacity:.93}
.lh .verdict{margin-left:auto;font:700 15px Arial}
/* Three 16:9 frames side by side occupy a 48:9 strip, so on a 16:9 screen the
   height is never the binding constraint — the leftover would become letterbox black
   above and below each frame, which is what read as "the bottom is empty". The stage
   therefore takes only the height its frame needs, and the surplus goes to the
   reasoning text, which is content worth enlarging at board distance. */
.stage{flex:none;background:#0d1220;overflow:hidden}
.frame{position:relative;aspect-ratio:1280/720;width:100%;overflow:hidden}
/* Every frame of the task is mounted at once and cross-faded by opacity. Swapping a
   single <img>'s src re-fetches and re-decodes it, which blanks the element for a
   frame or two — that flicker is what a visitor reads as "broken", and it is worst on
   exactly the step transitions this demo is made of. */
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
           opacity:0;transition:opacity .26s ease}
.frame img.on{opacity:1}
.lane.LOOK .cur,.lane.LOOK .fx,.lane.LOOK .fx2,.lane.LOOK .fx3,.lane.LOOK .tag{color:var(--look)}
.lane.READ .cur,.lane.READ .fx,.lane.READ .fx2,.lane.READ .fx3,.lane.READ .tag{color:var(--read)}
.lane.BOTH .cur,.lane.BOTH .fx,.lane.BOTH .fx2,.lane.BOTH .fx3,.lane.BOTH .tag{color:var(--both)}
/* Overlay geometry is a percentage of the 1280x720 viewport the agent saw, so it
   stays correct at any column width. */
.mk{position:absolute;pointer-events:none;opacity:0;
    transition:opacity .3s ease,left .9s var(--ease),top .9s var(--ease),
               width .9s var(--ease),height .9s var(--ease)}
.mk.on{opacity:1}

/* ---- the pointer -------------------------------------------------------------
   A step is not a slideshow cut: the agent moved somewhere and acted. The pointer
   travels to the target over ~0.9s on an ease-in-out curve (fast in the middle,
   settling at the end — roughly how a hand moves), the click fires, and only THEN
   does the frame change. Showing the frame first would put the effect before the
   cause, which is exactly what made the earlier version read as a flicker. */
:root{--ease:cubic-bezier(.33,.02,.2,1)}
.cur{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-2px 0 0 -2px;
     pointer-events:none;z-index:6;opacity:0;
     transition:opacity .35s ease,left .9s var(--ease),top .9s var(--ease),
                transform .12s ease}
.cur.on{opacity:1}
.cur.press{transform:scale(.74) rotate(-4deg)}
.cur svg{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}

/* click / type / select land as an expanding ring; scroll gets its own glyph */
/* Two rings, the second delayed, so the click reads as a beat rather than a blink —
   at board distance a single fast ring is easy to miss between glances. */
.fx{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
    pointer-events:none;z-index:5;opacity:0;border:4px solid currentColor;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.9),inset 0 0 0 1.5px rgba(255,255,255,.9)}
.fx.go{animation:ring .82s cubic-bezier(.15,.6,.3,1)}
@keyframes ring{
  0%{opacity:1;transform:scale(.3)}
  55%{opacity:.75}
  100%{opacity:0;transform:scale(6.2)}}
.fx2{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
     pointer-events:none;z-index:5;opacity:0;border:3px solid currentColor}
.fx2.go{animation:ring2 .82s cubic-bezier(.15,.6,.3,1) .14s}
@keyframes ring2{
  0%{opacity:.85;transform:scale(.3)}
  100%{opacity:0;transform:scale(4.4)}}
/* A solid flash marks the instant of contact, but it must not hide WHAT was clicked —
   an opaque disc over the target defeats the point of drawing the target at all. Kept
   translucent, small and short: visible as a pulse, transparent to the element under it. */
.fx3{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
     pointer-events:none;z-index:5;opacity:0;background:currentColor}
.fx3.go{animation:flash .3s ease-out}
@keyframes flash{0%{opacity:.5;transform:scale(.15)}100%{opacity:0;transform:scale(1.9)}}

/* the action word flashes where it happened, so a visitor reads WHAT was done
   without looking away from the frame */
/* The lane tints this element via `color`, and the background reads that same
   currentColor — so the label's own text CANNOT use `color`, or it comes out the
   same shade as the plate behind it and vanishes (it did: textContent said "click"
   while the screen showed a blank orange bar). The text therefore lives in child
   elements that set their own colour. */
.tag{position:absolute;z-index:7;padding:4px 11px;border-radius:7px;
     background:currentColor;font:700 15px Arial;letter-spacing:.3px;white-space:nowrap;
     box-shadow:0 0 0 2px rgba(255,255,255,.92),0 3px 9px rgba(0,0,0,.35);
     transform:translate(-50%,-190%);opacity:0;pointer-events:none}
.tag.go{animation:tagpop 1.15s ease-out}
@keyframes tagpop{
  0%{opacity:0;transform:translate(-50%,-150%) scale(.85)}
  18%{opacity:1;transform:translate(-50%,-200%) scale(1)}
  75%{opacity:1;transform:translate(-50%,-205%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-240%) scale(1)}}
/* target near the top edge: the label drops below it rather than off the stage */
.tag.below.go{animation:tagpopdown 1.15s ease-out}
@keyframes tagpopdown{
  0%{opacity:0;transform:translate(-50%,60%) scale(.85)}
  18%{opacity:1;transform:translate(-50%,110%) scale(1)}
  75%{opacity:1;transform:translate(-50%,115%) scale(1)}
  100%{opacity:0;transform:translate(-50%,150%) scale(1)}}
.tag b{color:#fff;font-weight:700}
.tag i{color:#fff;opacity:.85;font-weight:400;font-style:normal}
.mk.box{border:3px solid #fff;border-radius:3px;
        box-shadow:0 0 0 2.5px currentColor,0 0 13px rgba(0,0,0,.55)}
.lane.BOTH .mk.box{border-width:4px;animation:pulse 1.5s ease-out infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 3px currentColor,0 0 0 3px rgba(20,133,95,.55),0 0 13px rgba(0,0,0,.5)}
  70%{box-shadow:0 0 0 3px currentColor,0 0 0 15px rgba(20,133,95,0),0 0 13px rgba(0,0,0,.5)}
  100%{box-shadow:0 0 0 3px currentColor,0 0 0 3px rgba(20,133,95,0),0 0 13px rgba(0,0,0,.5)}}
/* No dimming layer. An earlier build dimmed the SoM lane to make its highlight stand
   out among the numbered boxes; measured on the rendered page that cost it 36% of its
   brightness (212 -> 135) while LOOK and READ stayed at 212, and at board distance it
   simply read as "the picture is dark". The numbers ARE what this lane is showing, so
   the highlight is carried by weight and motion instead. */
.mk.point{width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;
          border:3.5px solid currentColor;box-shadow:0 0 0 2.5px #fff,0 0 13px rgba(0,0,0,.55)}
.mk.point::after{content:"";position:absolute;inset:11px;border-radius:50%;background:currentColor}
.mk .eid{position:absolute;top:-15px;left:-15px;min-width:30px;height:30px;padding:0 8px;
         border-radius:15px;background:var(--both);color:#fff;
         font:700 16px/30px Arial;text-align:center;letter-spacing:.2px;
         box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.45)}
.lane.LOOK .mk{color:var(--look)} .lane.READ .mk{color:var(--read)}
.lane.BOTH .mk{color:var(--both)}
.pending{position:absolute;inset:0;display:grid;place-items:center;
         background:rgba(17,17,17,.72);color:#fff;font:600 15px Arial;letter-spacing:.3px}
/* ONE fixed height for all three lanes. With min/max the box sized itself to its own
   text — READ's five-line reason next to LOOK's two — so the lanes came out different
   heights and, being centre-aligned, sat at different vertical offsets. Three panels
   meant to be compared must share a baseline, so the box is a fixed height that scales
   with the viewport and scrolls if a reason overruns it. */
.think{padding:14px 16px;flex:none;height:clamp(118px,15.5vh,205px);overflow:auto;
       font-size:16.5px;line-height:1.5;
       color:#2b3555;border-top:1px solid var(--hair);background:var(--fill);
       transition:opacity .18s ease}
.think.swap{opacity:.25}
.think .none{color:var(--muted);font-style:italic}
.think .did{display:block;margin-top:7px;color:var(--ink);font:600 15.5px Arial}
.foot{display:flex;align-items:center;gap:11px;padding:10px 15px;border-top:1px solid var(--hair);
      font:14px Arial;color:var(--muted);flex:none}
.foot .act{font:600 12.5px "Consolas",monospace;padding:2px 7px;border-radius:5px;
           background:var(--fill);border:1px solid var(--hair);color:var(--ink)}
.foot .usd{margin-left:auto;font:700 17px Arial;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--hair)} .bar i{display:block;height:100%;background:currentColor;transition:width .26s ease}
.lane.LOOK .bar{color:var(--look)} .lane.READ .bar{color:var(--read)}
.lane.BOTH .bar{color:var(--both)}
.ok{color:#eafff5} .no{color:#ffe6e3}
footer{display:flex;align-items:center;gap:15px;padding:10px 26px 12px;color:var(--muted);font-size:13px;flex:none}
button{padding:7px 14px;border:1.5px solid var(--hair);border-radius:8px;background:#fff;
       cursor:pointer;font:600 13.5px Arial;color:var(--ink)}
button:hover{border-color:var(--ink)}
kbd{border:1px solid var(--hair);border-bottom-width:2.5px;border-radius:5px;padding:1px 6px;
    font:12px Consolas,monospace;background:var(--fill)}
.prov{margin-left:auto;text-align:right;line-height:1.4}
@media(max-width:1000px){.lanes{grid-template-columns:1fr}}
</style>

</head>
<body>
<header>
  <h1>Look, read, or both?</h1>
  <div class="sub">The same task, replayed in three representations. Each lane is
    <b>one recorded run</b> — screenshots and clicks are the agent's own; nothing is live.</div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>
<div class="taskbar">
  <div class="intent" id="intent"></div>
  <div class="caption" id="caption"></div>
</div>
<div class="lanes" id="lanes"></div>
<footer>
  <button id="play">Pause</button>
  <button id="prev">◀ Step</button>
  <button id="next">Step ▶</button>
  <span><kbd>←</kbd><kbd>→</kbd> step · <kbd>space</kbd> play/pause · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> task</span>
  <span class="prov" id="prov"></span>
</footer>

<script src="data.js"></script>
<script>
const WHAT = {LOOK:"screenshot only", READ:"text tree only", BOTH:"marked screenshot"};
const ORDER = ["LOOK","READ","BOTH"];
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let task = window.DEMO_TASKS[0], cursor = 0, playing = true, timer = null;
let EL = {};                                  // lane -> live element refs, built once per task

const maxLen = t => Math.max(...ORDER.map(k => window.DEMO[t].lanes[k].frames.length));

// Decode every frame up front. 82 images / 15 MB total: cheap once, and it removes
// the one thing that still stutters after the DOM stops being rebuilt.
(function preload(){
  for (const t of window.DEMO_TASKS)
    for (const k of ORDER)
      for (const f of window.DEMO[t].lanes[k].frames) new Image().src = f.img;
})();

function tabs(){
  $("#tabs").innerHTML = "";
  window.DEMO_TASKS.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(t === task));
    const o = window.DEMO[t].lanes;
    b.innerHTML = `task ${t} &nbsp;` + ORDER
      .map(k => `<span style="color:var(--${k.toLowerCase()})">${o[k].success ? "✓" : "✗"}</span>`).join("");
    b.onclick = () => go(t);
    $("#tabs").appendChild(b);
  });
}

// Build the three lanes for a task ONCE, mounting every frame stacked. After this the
// only per-step work is toggling classes and writing text — no node is created or
// destroyed, so nothing can blank out mid-transition.
function mount(){
  const d = window.DEMO[task];
  $("#intent").innerHTML = '<span class="q">Task:</span> ' + esc(d.intent);
  $("#caption").innerHTML = esc(d.caption);
  const box = $("#lanes"); box.innerHTML = ""; EL = {};
  ORDER.forEach(k => {
    const L = d.lanes[k];
    const el = document.createElement("div");
    el.className = "lane " + k;
    el.innerHTML = `
      <div class="lh"><b>${k}</b><span class="what">${WHAT[k]}</span>
        <span class="verdict ${L.success ? "ok" : "no"}">${L.success ? "✓ solved" : "✗ failed"} · ${L.steps} steps</span></div>
      <div class="stage"><div class="frame">
        ${L.frames.map((f,i) => `<img src="${f.img}" alt="${k} step ${f.step}" data-i="${i}">`).join("")}
        <div class="mk box"><span class="eid"></span></div>
        <div class="mk point"></div>
        <div class="fx"></div><div class="fx2"></div><div class="fx3"></div><div class="tag"></div>
        <div class="cur"><svg width="26" height="26" viewBox="0 0 26 26">
          <path d="M3 2 L3 20 L8 15.5 L11.3 22.6 L14.6 21 L11.4 14.2 L18 14 Z"
                fill="#fff" stroke="#141E41" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
      </div></div>
      <div class="think"></div>
      <div class="foot"><span class="act">—</span><span class="pos"></span><span class="usd"></span></div>
      <div class="bar"><i></i></div>`;
    box.appendChild(el);
    EL[k] = {imgs:[...el.querySelectorAll(".frame img")], box:el.querySelector(".mk.box"),
             eid:el.querySelector(".eid"), point:el.querySelector(".mk.point"),
             cur:el.querySelector(".cur"), fx:el.querySelector(".fx"),
             fx2:el.querySelector(".fx2"), fx3:el.querySelector(".fx3"),
             tag:el.querySelector(".tag"),
             think:el.querySelector(".think"), act:el.querySelector(".act"),
             pos:el.querySelector(".pos"), usd:el.querySelector(".usd"),
             bar:el.querySelector(".bar i"), lane:el};
  });
  $("#prov").innerHTML = ORDER.map(k => `${k}: <code>${d.lanes[k].run}</code>`).join("<br>");
}

// A step plays in three beats so that cause precedes effect:
//   1. MOVE   the pointer travels to this step's target (~0.9s, ease-in-out)
//   2. ACT    the click ring fires and the action word flashes at that spot
//   3. RESULT the frame cross-fades to the page the action produced
// Beat 3 is why the frame index shown is `i` while the pointer aims at frame `i`'s
// target and then advances: the screenshot stored with a step is the page BEFORE the
// action, so revealing the next one on the click is the honest ordering, not a flourish.
const T_MOVE = 950, T_ACT = 520, T_HOLD = 1250;
const STEP_MS = T_MOVE + T_ACT + T_HOLD;
let beats = [];

const clearBeats = () => { beats.forEach(clearTimeout); beats = []; };
const at = (ms, fn) => beats.push(setTimeout(fn, ms));
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

// Where the pointer should sit for a frame: the centre of a box, the point itself,
// or — for a step with no target, e.g. scroll — wherever it already is.
function aim(m){
  if (!m) return null;
  return m.kind === "box" ? {x:(m.x + m.w/2)/12.8, y:(m.y + m.h/2)/7.2}
                          : {x:m.x/12.8, y:m.y/7.2};
}

function paint(opts){
  const anim = !(opts && opts.instant);
  clearBeats();
  const d = window.DEMO[task];
  ORDER.forEach(k => {
    const L = d.lanes[k], e = EL[k];
    const i = Math.min(cursor, L.frames.length - 1);
    const f = L.frames[i], done = cursor > L.frames.length - 1;

    // beat 0 — the frame this action is about, plus its text
    e.imgs.forEach((im, j) => im.classList.toggle("on", j === i));
    setText(e, L, f, i);

    const m = f.mark, a = aim(m);
    const showId = k === "BOTH" && m && m.id != null;
    if (m && m.kind === "box"){
      Object.assign(e.box.style, {left:(m.x/12.8)+"%", top:(m.y/7.2)+"%",
                                 width:(m.w/12.8)+"%", height:(m.h/7.2)+"%"});
      e.eid.textContent = showId ? m.id : "";
      e.eid.style.display = showId ? "" : "none";
      e.box.classList.add("on"); e.point.classList.remove("on");
    } else if (m && m.kind === "point"){
      Object.assign(e.point.style, {left:(m.x/12.8)+"%", top:(m.y/7.2)+"%"});
      e.point.classList.add("on"); e.box.classList.remove("on");
    } else { e.box.classList.remove("on"); e.point.classList.remove("on"); }

    if (done){ e.cur.classList.remove("on"); return; }

    // beat 1 — travel. Without `anim` the pointer is teleported (manual stepping
    // backwards, or a task switch), so it never crawls across a stale frame.
    if (a){
      e.cur.classList.add("on");
      if (!anim) e.cur.style.transition = "none";
      e.cur.style.left = a.x + "%"; e.cur.style.top = a.y + "%";
      if (!anim) { void e.cur.offsetWidth; e.cur.style.transition = ""; }
    }
    if (!anim) return;

    // beat 2 — the act, at the place the pointer just reached
    at(T_MOVE, () => {
      if (a){
        ["fx","fx2","fx3"].forEach(n => {
          e[n].style.left = a.x + "%"; e[n].style.top = a.y + "%";
        });
        // Anchor the label to the box's own top/bottom edge, and flip it below when
        // that edge is too close to the top of the stage to fit the label above it.
        const topPct = m.kind === "box" ? m.y/7.2 : a.y;
        const botPct = m.kind === "box" ? (m.y + m.h)/7.2 : a.y;
        const below = topPct < 11;
        e.tag.classList.toggle("below", below);
        e.tag.style.left = a.x + "%";
        e.tag.style.top = (below ? Math.min(botPct, 96) : Math.max(topPct, 4)) + "%";
        e.tag.innerHTML = `<b>${verb(f.action)}</b>` + (showId ? ` <i>[${m.id}]</i>` : "");
        replay(e.fx, "go"); replay(e.fx2, "go"); replay(e.fx3, "go"); replay(e.tag, "go");
        e.cur.classList.add("press");
        at(T_MOVE + 130, () => e.cur.classList.remove("press"));
      } else {
        // no target (scroll / finish): say so where the pointer stands
        e.tag.style.left = e.cur.style.left || "50%";
        e.tag.style.top = e.cur.style.top || "50%";
        e.tag.innerHTML = `<b>${verb(f.action)}</b>`;
        replay(e.tag, "go");
      }
    });

    // beat 3 — the page the action produced
    if (i + 1 < L.frames.length)
      at(T_MOVE + T_ACT, () => e.imgs.forEach((im, j) => im.classList.toggle("on", j === i + 1)));
  });
}

const VERB = {click:"click", type:"type", scroll:"scroll", select_option:"select",
              goto:"go to", hover:"hover", key_press:"key", finish:"finish", stop:"finish"};
const verb = a => VERB[a] || a || "act";

function setText(e, L, f, i){
  const html = f.thought ? esc(f.thought) : noReason({...f, lane:e.lane.classList[1]});
  if (e.think.dataset.h !== html){
    e.think.dataset.h = html;
    e.think.classList.add("swap");
    at(110, () => { e.think.innerHTML = html; e.think.classList.remove("swap"); });
  }
  e.act.textContent = f.action || "—";
  e.pos.textContent = `step ${f.step + 1}/${L.frames.length}`;
  e.usd.textContent = "$" + f.cost_cum.toFixed(3);
  e.bar.style.width = (100 * (i + 1) / L.frames.length) + "%";
  e.lane.dataset.done = cursor >= L.frames.length - 1 ? "1" : "0";
}

// Some steps carry a tool call with no reasoning text. That is the recording, not a
// gap in it, so the lane says so and shows the action instead of inventing a thought.
function noReason(f){
  const what = f.lane === "BOTH" && f.mark && f.mark.id != null
             ? `${f.action} the element marked [${f.mark.id}]`
             : f.mark ? `${f.action} the highlighted element` : (f.action || "—");
  return '<span class="none">— the agent stated no reason —</span>' +
         `<span class="did">it did: ${esc(what)}</span>`;
}

function go(t){ task = t; cursor = 0; tabs(); mount(); paint(); }

function step(n){
  const back = n < 0;
  cursor += n;
  if (cursor >= maxLen(task) + 2){            // hold the finished state, then loop on
    const i = window.DEMO_TASKS.indexOf(task);
    go(window.DEMO_TASKS[(i + 1) % window.DEMO_TASKS.length]);
    return;
  }
  if (cursor < 0) cursor = 0;
  paint(back ? {instant:true} : undefined);
}
function loop(){ clearInterval(timer); if (playing) timer = setInterval(() => step(1), STEP_MS); }
const manual = n => { playing = false; $("#play").textContent = "Play"; loop(); step(n); };

$("#next").onclick = () => manual(1);
$("#prev").onclick = () => manual(-1);
$("#play").onclick = () => { playing = !playing; $("#play").textContent = playing ? "Pause" : "Play"; loop(); };
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") manual(1);
  else if (e.key === "ArrowLeft") manual(-1);
  else if (e.key === " ") { e.preventDefault(); $("#play").click(); }
  else if ("123".includes(e.key)) go(window.DEMO_TASKS[+e.key - 1]);
});

tabs(); mount(); paint(); loop();
</script>
</body>
</html>
