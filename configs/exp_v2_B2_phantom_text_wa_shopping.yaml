# B2 P-text ablation — WA shopping
# DOM prompt + SoM marks 文本 + 无图;与 B2 phantom_som wa_shopping 唯一差: system prompt

defaults:
  - configs/exp_v2_wa_base.yaml

experiment:
  phase: "phase1"
  name: "B2_phantom_text_wa_shopping"

task:
  include_sites: ["shopping"]
  site_configs:
    shopping: "external/visualwebarena/config_files/wa/test_shopping.raw.json"

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_text"]

backends:
  default_backend: "local_gemma"
  local_gemma:
    max_new_tokens: 4096

