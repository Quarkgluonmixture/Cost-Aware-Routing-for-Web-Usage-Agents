# B1 Phantom-prompt (P-prompt §106) — VWA classifieds
# SoM prompt + AXTree text + 无图。symmetric counterpart of phantom_text (P-text).
# Together with phantom_text, completes the diamond design — paper Section 7
# cross-capability check that prompt × text interaction holds on B1 too.
# B1 4B 本地推理；与 B1_phantom_text_classifieds 仅差 system prompt（DOM vs SoM）。

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B1_phantom_prompt_classifieds"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_prompt"]

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 4096
    temperature: 0.0  # B-271 (2026-05-16, A1.7): explicit pin for paper-grade audit parity with B0

