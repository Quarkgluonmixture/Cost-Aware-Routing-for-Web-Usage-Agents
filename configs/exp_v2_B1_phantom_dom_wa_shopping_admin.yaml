# B1 Phantom-DOM ablation (§103) — WA shopping_admin
# DOM prompt + SoM marks 文本 + 无图，与 B1 phantom_som shopping_admin 唯一差: system prompt

defaults:
  - configs/exp_v2_wa_base.yaml

experiment:
  phase: "phase1"
  name: "B1_phantom_dom_wa_shopping_admin"

task:
  include_sites: ["shopping_admin"]
  site_configs:
    shopping_admin: "external/visualwebarena/config_files/wa/test_shopping_admin.raw.json"

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_dom"]

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 384
    min_free_vram_gb: 0

baselines:
  run_b0: false
