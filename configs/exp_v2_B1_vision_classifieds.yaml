# B1 vision classifieds — Phase 1a paper-grade baseline (post 2026-05-13 codex stress audit)
# Single-mode launch via queue_baseline.sh. Part of 42-condition (Pass-1 36 baseline + Pass-2 6 router) Phase 1a scope
# (2 sites × 3 models × 6 modes; Gemma3-VL added 2026-05-14). See preregistration.md §4 N_conditions row.

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B1_vision_classifieds"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["vision"]

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 4096
    temperature: 0.0  # B-271 (2026-05-16, A1.7): explicit pin for paper-grade audit parity with B0

