# B1 vision classifieds — Phase 1a paper-grade baseline (post 2026-05-13 codex stress audit)
# Single-mode launch via queue_baseline.sh. Part of 24-condition Phase 1a scope
# (2 sites × 2 models × 6 modes). See preregistration.md §4 N_conditions row.

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B1_vision_classifieds"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["vision"]

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 384
    min_free_vram_gb: 0

baselines:
  run_b0: false
