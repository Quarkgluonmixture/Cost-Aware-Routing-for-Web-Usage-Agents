# B2 (Gemma3-VL) vision classifieds — Phase 1a paper-grade baseline
# Cross-family 3rd baseline: google/gemma-3-4b-it (advisor 2026-05-14, 笔记 §138).
# Mirrors the B1 per-condition config family exactly; only the backend differs.
# observation_mode value = "vision" (filename mode = vision;
# and analysis bucketing line up across all 3 baselines).

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B2_vision_classifieds"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["vision"]

backends:
  default_backend: "local_gemma"
  local_gemma:
    max_new_tokens: 4096
    temperature: 0.0  # B-271 (2026-05-16, A1.7): explicit pin for paper-grade audit parity with B0

