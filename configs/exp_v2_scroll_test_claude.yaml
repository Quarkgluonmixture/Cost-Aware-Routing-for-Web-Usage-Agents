# Scroll comparison: Claude Sonnet 4.6 on Bedrock proxy
# Tests whether scroll direction errors are Qwen3-VL specific or model-agnostic.
# 20 scroll-heavy classifieds tasks, SoM mode only.
#
# API: Bedrock proxy (free), Anthropic format
# Run: bash scripts/dgx/run_scroll_comparison.sh claude

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "scroll_test_claude"

task:
  include_sites: ["classifieds"]
  task_ids:
    classifieds: [0, 5, 8, 16, 24, 26, 28, 32, 63, 64, 105, 112, 135, 136, 151, 169, 170, 174, 200, 201]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["som"]

backends:
  default_backend: "api_strong"
  api_strong:
    type: "api_proxy"
    api_name: "eu.anthropic.claude-sonnet-4-6"
    base_url: "https://i5xpracyci.execute-api.eu-west-2.amazonaws.com/model-api/invoke"
    api_format: "anthropic"
    api_key_env: "PROXY_API_KEY"
    temperature: 0.1
    max_new_tokens: 4096
    max_image_payload_bytes: 5242880
    image_max_size: 1280
    max_obs_chars: 12000
    dom_mode: "llm"
    mock_mode: false

metrics:
  cost_api:
    # Claude Sonnet 4.6 Bedrock proxy pricing
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: false
    use_pynvml: false
    use_psutil: false

baselines:
  run_b0: false
