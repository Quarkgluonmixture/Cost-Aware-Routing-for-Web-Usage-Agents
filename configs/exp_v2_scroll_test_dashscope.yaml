# Scroll comparison: Qwen3-VL-235B-instruct on DashScope (official API)
# Tests whether scroll/parse errors are Bedrock proxy artifacts vs model issues.
# 10 scroll-heavy classifieds tasks, SoM mode only.
#
# API: DashScope international (1M free tokens), OpenAI-compatible format
# Run: bash scripts/dgx/run_scroll_comparison.sh dashscope

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "scroll_test_dashscope"

task:
  include_sites: ["classifieds"]
  task_ids:
    classifieds: [5, 8, 26, 28, 105, 112, 135, 136, 151, 201]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["som"]

backends:
  default_backend: "api_strong"
  api_strong:
    type: "api_proxy"
    api_name: "qwen3-vl-235b-a22b-instruct"
    base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
    api_format: "openai"
    api_key_env: "DASHSCOPE_API_KEY"
    temperature: 0.1
    max_new_tokens: 4096
    max_image_payload_bytes: 5242880
    image_max_size: 1280
    max_obs_chars: 12000
    dom_mode: "llm"
    mock_mode: false

metrics:
  cost_api:
    # Qwen3-VL-235B DashScope official pricing
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: false
    use_pynvml: false
    use_psutil: false

baselines:
  run_b0: false
