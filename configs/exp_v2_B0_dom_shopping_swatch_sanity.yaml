# B0 DOM shopping sanity check — 11 tasks affected by Magento custom-option
# radio swatch-loop bug. Runs a small subset post-fix to verify
# page_change_reasons now contains form_value_changed when swatch is clicked.
# See docs/analysis/cross_sites/swatch_form_change_audit.md.

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B0_dom_shopping_swatch_sanity"

task:
  include_sites: ["shopping"]
  task_ids:
    shopping: [0, 46, 245, 262, 281, 288, 329, 349, 383, 415, 458]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["dom"]

backends:
  default_backend: "api_strong"
  api_strong:
    type: "api_proxy"
    api_name: "qwen.qwen3-vl-235b-a22b"
    base_url: "https://i5xpracyci.execute-api.eu-west-2.amazonaws.com/model-api/invoke"
    temperature: 0.1
    max_new_tokens: 4096
    max_image_payload_bytes: 5242880
    image_max_size: 1280
    max_obs_chars: 12000
    dom_mode: "llm"
    mock_mode: false
    use_glm_fallback: true
    glm_config: ".auth/glm"

metrics:
  cost_api:
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: false

baselines:
  run_b0: false
