defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase2"
  name: "qwen3vl4b_baseline_phase2"

task:
  include_sites: ["shopping"]

variables:
  phase2:
    fixed_condition:
      som_on: false
      observation_mode: "hybrid"

backends:
  default_backend: "local_4b"
  local_4b:
    type: "local_qwen"
    path: "Qwen/Qwen3-VL-4B-Instruct"
    quantization: "none"
    device: "cuda"
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.9
    dom_mode: "llm"
    mock_mode: false
    min_free_vram_gb: 12

baselines:
  run_b0: false
