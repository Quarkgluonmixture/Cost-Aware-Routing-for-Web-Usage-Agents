# B0 learned router classifieds — Phase 1a Pass-2 paper-grade
# v7 walk-back 2026-05-16 (per proposals_v7.md D3 + user Q3/Q2 confirmation):
# This config emits 1 router condition per cell (vs 6 per-mode in baseline pass).
# obs_mode="learned" sentinel signals runner to dispatch through LR predictor.
#
# ✅ RUNTIME LR INTEGRATION DONE (B-268 verify 2026-05-16, A1.7): runner main.py:1017 accepts observation_mode="learned"
# and routes through trained LR per task. See `proposals_v7.md` §3 + runner main.py:1011-1059 dispatch logic. Prerequisite
# train_l1_router.py artifact verified at lr_model_path (May 16 12:28 land).
#
# Launch via: bash scripts/queues/queue_router_learned.sh B0 classifieds
# Orchestrated by: queue_phase1_router_paper_grade.sh

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B0_router_learned_classifieds"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    # v7 learned router: 6-mode candidate set; LR picks per task
    observation_mode: ["learned"]
  phase1:
    variant: "router"
    router_kind: "learned"
    # Candidate mode set LR predicts over
    candidate_modes: ["dom", "som", "vision", "phantom_text", "phantom_prompt", "phantom_som"]

router:
  # v7 learned router config (no cascade L2 — paper-2 deferred)
  enabled: true
  kind: "learned"
  # A2.8 P0-4-AB* B-1556 (/stress 2026-05-18 cross-AI A+B 2-AI overlap OOB):
  # fold-aware artifact wiring REQUIRED. Runner `predict_mode_fold_aware(cell_id,
  # task_id, artifacts_dir, ...)` reads `{artifacts_dir}/{cell_id}_fold_assignment.json`
  # to lookup task fold k, then loads `{cell_id}_lr_fold{k}.pkl` + `vectorizer_fold{k}.pkl`
  # + `selected_idx_fold{k}.json` + `{cell_id}_lr_meta.json` (per-cell τ_{C,k}).
  # Without `cell_id`/`artifacts_dir`, runner reads `_fold_assignment.json` (empty
  # cell_id prefix) → task lookup fails → every task fallback to `safe_fallback_target`
  # → Pass-2 silently degenerates to all-phantom_som while logged as
  # `phase1_learned_router_*` condition. Paper §6 H10 verdict would then test the
  # fallback policy not the fold-aware LR.
  cell_id: "B0_classifieds"
  artifacts_dir: "results/phantom_paper/l1_router"
  # Legacy single-pickle path retained for back-compat smoke only; paper-grade
  # runtime uses the fold-aware artifact bundle above (5 fold pickles + 5 vectorizers
  # + 5 selected_idx + 1 fold_assignment + 1 cell_meta = 17 paths per cell).
  lr_model_path: "results/phantom_paper/l1_router/B0_classifieds_lr.pkl"
  # Safe fallback if LR predicts mode not in observed cell archive (e.g.
  # phantom_prompt on cls); paper §6 reports invalid predictions separately.
  safe_fallback_target: "phantom_som"
  latch_after_fallback: false  # learned router, no cascade

backends:
  default_backend: "api_strong"
  api_strong:
    type: "api_proxy"
    api_name: "qwen.qwen3-vl-235b-a22b"
    base_url: "https://i5xpracyci.execute-api.eu-west-2.amazonaws.com/model-api/invoke"
    temperature: 0.0
    max_new_tokens: 4096
    max_image_payload_bytes: 5242880
    image_max_size: 1280
    max_obs_chars: 12000
    dom_mode: "llm"
    mock_mode: false
    use_glm_fallback: false  # B-396 (/stress A1.1 P0-1 3-AI overlap, 2026-05-16): paper-grade hard-off (was true)
    glm_config: ".auth/glm"

metrics:
  cost_api:
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: false

