# B1 dom classifieds — NON-CANONICAL pre-Fire-6 pipeline smoke (2026-05-21).
# Identical to exp_v2_B1_dom_classifieds.yaml EXCEPT task.max_tasks_per_site: 1.
# Purpose: verify the Protocol Reset canonical path end-to-end on real A100 +
# real VWA docker BEFORE Fire-6 (two-budget counters + three-column cost land,
# JSON path works, no WAIT-as-valid, new fields reach CSV/JSON). NOT canonical
# data — run via `SMOKE_CONFIG=... FORCE_NEW=1 queue_baseline.sh B1 dom classifieds`;
# the smoke run dir (cfg_name B1_dom_classifieds_smoke) is isolated from Fire-6.

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B1_dom_classifieds_smoke"

task:
  include_sites: ["classifieds"]
  max_tasks_per_site: 1

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["dom"]

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 4096
    temperature: 0.0
