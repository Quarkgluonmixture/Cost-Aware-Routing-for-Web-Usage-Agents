# B0 Phantom-prompt (P-prompt §105) — VWA classifieds
# SoM prompt + AXTree text + 无图。symmetric counterpart of phantom_text (P-text).
# Together with phantom_text, completes the diamond design and lets us measure
# axis 2 (prompt) effect in BOTH AXTree-text and [SOM_MARKS]-text contexts,
# disentangling prompt × text interaction.

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B0_phantom_prompt_classifieds"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_prompt"]

backends:
  default_backend: "api_strong"
  api_strong:
    type: "api_proxy"
    api_name: "qwen.qwen3-vl-235b-a22b"
    base_url: "https://i5xpracyci.execute-api.eu-west-2.amazonaws.com/model-api/invoke"
    temperature: 0.0
    max_new_tokens: 4096
    max_image_payload_bytes: 5242880
    image_max_size: 1280
    max_obs_chars: 12000
    dom_mode: "llm"
    mock_mode: false
    use_glm_fallback: false  # B-396 (/stress A1.1 P0-1 3-AI overlap, 2026-05-16): paper-grade hard-off (was true)
    glm_config: ".auth/glm"

metrics:
  cost_api:
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: false

