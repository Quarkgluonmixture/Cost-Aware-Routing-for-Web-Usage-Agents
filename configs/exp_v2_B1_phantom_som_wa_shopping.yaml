# B1 Phantom-SoM (§103) — WA shopping
# B1 4B local on WebArena shopping (text-only benchmark)

defaults:
  - configs/exp_v2_wa_base.yaml

experiment:
  phase: "phase1"
  name: "B1_phantom_wa_shopping"

task:
  include_sites: ["shopping"]
  site_configs:
    shopping: "external/visualwebarena/config_files/wa/test_shopping.raw.json"

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_som"]

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 4096

