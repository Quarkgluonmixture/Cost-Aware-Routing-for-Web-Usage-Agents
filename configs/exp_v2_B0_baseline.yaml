# B0 — Strong API upper bound
# Purpose: confirm task solvability and establish performance ceiling for dissertation.
# Uses Qwen3-VL-235B-A22B via custom proxy API (Anthropic Messages style), SOM mode.
# Run: bash scripts/dgx/run_b0_api_baseline.sh
#
# Key differences from B1 (local 4B):
#   - Backend: api_proxy (Qwen3-VL-235B via proxy) vs local_4b (Qwen3-VL-4B)
#   - max_new_tokens: 4096 — room for action JSON
#   - Pricing: $0.001/1K in, $0.005/1K out (proxy reports per-request cost)
#   - Energy tracking: disabled (local GPU is idle; server inference energy is opaque)

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B0_api_strong_upper_bound"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: []

backends:
  default_backend: "api_strong"
  api_strong:
    type: "api_proxy"
    api_name: "qwen.qwen3-vl-235b-a22b"
    base_url: "https://i5xpracyci.execute-api.eu-west-2.amazonaws.com/model-api/invoke"
    temperature: 0.1
    top_p: 0.9
    max_new_tokens: 4096
    enable_thinking: false
    max_image_payload_bytes: 5242880
    image_max_size: 1280
    max_obs_chars: 12000
    dom_mode: "llm"
    mock_mode: false

metrics:
  cost_api:
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: false
    use_pynvml: false
    use_psutil: false

baselines:
  run_b0: true
  b0_backend: "api_strong"
  b0_observation_mode: "som"
