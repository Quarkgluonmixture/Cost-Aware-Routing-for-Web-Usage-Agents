# B2 Phantom-SoM — WA shopping
# Cross-family 3rd baseline: google/gemma-3-4b-it (advisor 2026-05-14, 笔记 §138).
# Mirrors B1 phantom_wa_shopping; only backend differs.

defaults:
  - configs/exp_v2_wa_base.yaml

experiment:
  phase: "phase1"
  name: "B2_phantom_wa_shopping"

task:
  include_sites: ["shopping"]
  site_configs:
    shopping: "external/visualwebarena/config_files/wa/test_shopping.raw.json"

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_som"]

backends:
  default_backend: "local_gemma"
  local_gemma:
    max_new_tokens: 4096

