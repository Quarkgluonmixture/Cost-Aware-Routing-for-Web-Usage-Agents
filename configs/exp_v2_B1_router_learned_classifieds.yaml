# B1 (Qwen3-VL-4B local) learned router classifieds — Phase 1a Pass-2 paper-grade
# v7 walk-back 2026-05-16. See `exp_v2_B0_router_learned_classifieds.yaml` header.

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B1_router_learned_classifieds"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["learned"]
  phase1:
    variant: "router"
    router_kind: "learned"
    candidate_modes: ["dom", "som", "vision", "phantom_text", "phantom_prompt", "phantom_som"]

router:
  enabled: true
  kind: "learned"
  # A2.8 P0-4-AB* B-1556: fold-aware artifact wiring REQUIRED (see B0 cls YAML for full rationale).
  cell_id: "B1_classifieds"
  artifacts_dir: "results/phantom_paper/l1_router"
  lr_model_path: "results/phantom_paper/l1_router/B1_classifieds_lr.pkl"  # legacy back-compat
  safe_fallback_target: "phantom_som"
  latch_after_fallback: false

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 4096
    temperature: 0.0  # B-271 (2026-05-16, A1.7): explicit pin for paper-grade audit parity with B0

