# B1 phantom_prompt — WA shopping_admin
# Generated 2026-05-15: WA 6-mode parity with VWA (was: phantom + phantom_text only).
# Mirrors the VWA per-condition pattern; defaults to wa_base for DATASET=webarena.

defaults:
  - configs/exp_v2_wa_base.yaml

experiment:
  phase: "phase1"
  name: "B1_phantom_prompt_wa_shopping_admin"

task:
  include_sites: ["shopping_admin"]
  site_configs:
    shopping_admin: "external/visualwebarena/config_files/wa/test_shopping_admin.raw.json"

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_prompt"]

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 4096
    min_free_vram_gb: 0

baselines:
  run_b0: false
