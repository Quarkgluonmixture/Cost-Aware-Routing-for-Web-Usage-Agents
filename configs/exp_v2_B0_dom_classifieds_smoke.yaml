# B0 dom classifieds — NON-CANONICAL pre-Fire-6 pipeline smoke (2026-05-21).
# Identical to exp_v2_B0_dom_classifieds.yaml EXCEPT task.max_tasks_per_site: 1.
# Verifies the B0 native tool-call (tool_choice=required) path + accounting on
# real A100 + AWS proxy BEFORE Fire-6. NOT canonical data. Uses ~1 task of B0
# proxy quota. Run via `SMOKE_CONFIG=... FORCE_NEW=1 queue_baseline.sh B0 dom classifieds`.

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B0_dom_classifieds_smoke"

task:
  include_sites: ["classifieds"]
  max_tasks_per_site: 1

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["dom"]

backends:
  default_backend: "api_strong"
  api_strong:
    type: "api_proxy"
    api_name: "qwen.qwen3-vl-235b-a22b"
    base_url: "https://i5xpracyci.execute-api.eu-west-2.amazonaws.com/model-api/invoke"
    temperature: 0.0
    max_new_tokens: 4096
    max_image_payload_bytes: 5242880
    image_max_size: 1280
    max_obs_chars: 12000
    dom_mode: "llm"
    mock_mode: false
    use_glm_fallback: false
    glm_config: ".auth/glm"

metrics:
  cost_api:
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: false
