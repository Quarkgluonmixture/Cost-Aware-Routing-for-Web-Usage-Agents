# B0 三模式 WA shopping_admin — 使用 api_proxy (Qwen3-VL-235B)
# 运行: bash scripts/dgx/run_b0_3mode_wa.sh

defaults:
  - configs/exp_v2_wa_base.yaml

experiment:
  phase: "phase1"
  name: "B0_3mode_wa_shopping_admin"

task:
  include_sites: ["shopping_admin"]
  site_configs:
    shopping_admin: "external/visualwebarena/config_files/wa/test_shopping_admin.raw.json"

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["dom", "som", "vision"]

backends:
  default_backend: "api_strong"
  api_strong:
    type: "api_proxy"
    api_name: "qwen.qwen3-vl-235b-a22b"
    base_url: "https://i5xpracyci.execute-api.eu-west-2.amazonaws.com/model-api/invoke"
    temperature: 0.1
    max_new_tokens: 4096
    max_image_payload_bytes: 5242880
    image_max_size: 1280
    max_obs_chars: 12000
    dom_mode: "llm"
    mock_mode: false
    use_glm_fallback: true
    glm_config: ".auth/glm"

metrics:
  cost_api:
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: false

baselines:
  run_b0: false
