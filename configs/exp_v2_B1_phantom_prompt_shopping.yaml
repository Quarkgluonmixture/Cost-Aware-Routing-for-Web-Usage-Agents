# B1 P-prompt — VWA shopping (Phase 1b)
#
# Created 2026-08-09. B0 and B2 have had their full shopping phantom triple since
# 2026-05-14/15; B1's was never written because Phase 1b was scoped B0-only at the
# time. Nothing about B1 made shopping special — it was simply not on the chain.
#
# Why it matters now: preregistration §216.1 records that "Phase 1b shop is the
# only true OOD" for the H10 router split — every Phase 1a cell shares one task
# pool, so LOCO across those cells is not an out-of-distribution test. This
# condition is part of the only data that can answer whether routing generalises.
#
# Mirrors exp_v2_B1_phantom_prompt_classifieds.yaml exactly; only include_sites differs.

defaults:
  - configs/exp_v2_B1_shop_strat200_base.yaml   # stratified 200-task subset (2026-08-09)

experiment:
  phase: "phase1"
  name: "B1_phantom_prompt_shopping"


runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_prompt"]

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 4096
    temperature: 0.0  # B-271: explicit pin for paper-grade audit parity with B0
