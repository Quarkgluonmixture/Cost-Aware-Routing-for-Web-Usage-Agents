# B1 shopping — stratified 200-task subset (2026-08-09)
#
# WHY A SUBSET AT ALL
# B1 measures ~10.5 min/episode (four reddit runs: 9.3 / 10.4 / 10.7 / 10.8),
# so the full 435-episode shopping set is ~76h per condition and ~19 days for
# the six-mode chain — past the 09-01 thesis deadline, and the proxy top-up will
# interrupt it anyway (same site can only host one baseline, so B0's 374/466
# resume takes precedence the moment credit returns).
#
# WHY STRATIFIED AND NOT max_tasks_per_site: 200
# `max_tasks_per_site` truncates in file order, and shopping task_ids are NOT
# arranged randomly. Measured on the 435-task run set:
#
#                     templates covered   easy /  hard / medium
#   full 435            151/151           23%  /  32%  /  45%
#   first 200            69/151 (46%)     34%  /  26%  /  39%   <- biased
#   stratified 200      151/151 (100%)    21%  /  33%  /  46%   <- matches
#
# Taking the first 200 would drop 82 of 151 templates entirely and skew toward
# easy tasks — i.e. it would inflate SR for reasons that have nothing to do with
# the model. The list below is a round-robin over intent_template_id preserving
# file order within each template, which recovers full template coverage and a
# difficulty mix within ~2pp of the full set on every level.
#
# ⚠️ This subset is an OOD EXTENSION, not part of the preregistered 6 cells.
# Report it as a 200-task stratified subsample; never pool it with a 435-task
# run as if the denominators matched.
#
# Regenerate: see 笔记 §446 / the round-robin snippet used to produce this list.

defaults:
  - configs/exp_v2_base.yaml

task:
  include_sites: ["shopping"]
  task_ids:
