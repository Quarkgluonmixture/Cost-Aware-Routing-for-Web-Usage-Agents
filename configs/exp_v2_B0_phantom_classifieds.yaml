# B0 Phantom-SoM (§25 / §100/§101) — classifieds
# Phantom-SoM = SoM prompt + SoM marks 文本 + 无图（试 mirage effect）
# 与 B0_3mode_classifieds.yaml 配套：仅跑 phantom_som condition

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B0_phantom_classifieds"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_som"]

backends:
  default_backend: "api_strong"
  api_strong:
    type: "api_proxy"
    api_name: "qwen.qwen3-vl-235b-a22b"
    base_url: "https://i5xpracyci.execute-api.eu-west-2.amazonaws.com/model-api/invoke"
    temperature: 0.0
    max_new_tokens: 4096
    max_image_payload_bytes: 5242880
    image_max_size: 1280
    max_obs_chars: 12000
    dom_mode: "llm"
    mock_mode: false
    use_glm_fallback: true
    glm_config: ".auth/glm"

metrics:
  cost_api:
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: false

baselines:
  run_b0: false
