# WA (WebArena) base config — overrides VWA defaults for WA three-site setup
# Sites: shopping (192), shopping_admin (182), reddit (106) = 480 tasks
#
# Inherits from exp_v2_base.yaml, overrides:
#   - experiment.benchmark: webarena
#   - task.include_sites / site_configs for WA per-site split files
#   - env.benchmark for DATASET switching in VWAWrapper

defaults:
  - configs/exp_v2_base.yaml

experiment:
  benchmark: "webarena"

env:
  benchmark: "webarena"

task:
  include_sites: ["shopping", "shopping_admin", "reddit"]
  site_configs:
    shopping: "external/visualwebarena/config_files/wa/test_shopping.raw.json"
    shopping_admin: "external/visualwebarena/config_files/wa/test_shopping_admin.raw.json"
    reddit: "external/visualwebarena/config_files/wa/test_reddit.raw.json"
  # Cross-benchmark pilot task pool — prereg §8.8 mini-prereg (B-1296/B-1627).
  # Stratified 10-per-site draw at seed=42 from each site's SCORED pool (N/A
  # tasks excluded per §139.8, same `_is_na_task` predicate the runner applies),
  # generated by `scripts/queues/_wa_pilot_task_sample.py` — regenerate with
  # `--emit-yaml` to verify these ids reproduce. Per-site seeds are derived
  # independently, so landing a gitlab stratum later extends the sample without
  # perturbing these draws.
  # The pilot runs the full 6-mode universe (Vision INCLUDED, user 2026-07-27),
  # a superset of the registered 5-mode estimand — report the registered
  # 5-mode mean-pairwise Jaccard as primary, 6-mode as exploratory.
  task_ids:
    reddit: [581, 584, 597, 598, 607, 635, 641, 652, 715, 729]
    shopping: [143, 158, 164, 324, 336, 353, 432, 436, 519, 520]
    shopping_admin: [5, 77, 95, 116, 130, 291, 344, 458, 680, 771]
