experiment:
  name: "p79_unified_experiment"
  benchmark: "visualwebarena"
  # Single seed or list for multi-seed runs: [42, 123, 456]
  seed: 42
  output_root: "results"

task:
  # VWA has 3 standalone site task sets; wikipedia tasks are cross-site
  # references embedded in reddit/shopping configs (no separate raw.json).
  include_sites: ["shopping", "reddit", "classifieds"]
  max_tasks_per_site: null
  task_ids: {}
  site_configs:
    shopping: "external/visualwebarena/config_files/vwa/test_shopping.raw.json"
    reddit: "external/visualwebarena/config_files/vwa/test_reddit.raw.json"
    classifieds: "external/visualwebarena/config_files/vwa/test_classifieds.raw.json"

env:
  type: "vwa"
  headless: true
  observation_type: "accessibility_tree"
  dry_run: false
  viewport_width: 1280
  viewport_height: 720
  # Post-action settle time before observation capture (seconds).
  # Ensures AXTree and screenshot are from the same stable page state.
  # Increase for vision/som modes if screenshots appear truncated.
  sleep_after_execution: 0.5

runtime:
  # B-700 (/stress A1.7 cold-start P2-11-A, 2026-05-17): max_steps 40 → 30
  # aligned with the 119 per-condition yaml overrides (every paper-grade
  # yaml explicitly sets max_steps: 30 — VWA empirical max-task-budget
  # for cls/red task length distribution). Pre-fix the base default 40
  # was DEAD: every existing yaml override; any new yaml forgetting the
  # override silently inflated cost data 33% (40/30) → broke cross-cell
  # cost comparisons. Aligning the base default removes the silent
  # contamination vector. Note: the actual yaml-config-load default still
  # falls back to 40 in `config.py:259 cfg["runtime"].setdefault(
  # "max_steps", 40)` for non-yaml callers (e.g. unit-test bare cfgs);
  # the 30 here is the canonical paper-grade base.
  max_steps: 30
  resume: true

variables:
  primary:
    # Three flat observation modes — som_on is derived (true only for "som").
    observation_mode: ["dom", "som", "vision"]
    router: [false, true]
  secondary:
    modules: ["none", "m1", "m2", "m3", "m4"]

router:
  cheap_default_mode: "dom"
  rich_escalation_mode: "som"
  thresholds:
    dom_size_threshold: 12000
    unchanged_steps_trigger: 2
    no_progress_steps_trigger: 2
    retry_limit: 1
  checklist_trigger:
    enabled: false
    stalled_steps_trigger: 2
    failed_item_trigger: true
  # Router overhead: GPU amortized cost per ms
  # DGX Spark GB10: $4,699 / 3yr + 140W × $0.12/kWh ≈ $0.20/hr → 5.6e-8 $/ms
  overhead_cost_per_ms: 0.000000056
  # Extra model call cost: average cost of one local 4B inference (~$0.001)
  extra_model_call_cost_usd: 0.001
  # Retry cost: one env step + heuristic action (~$0.0005)
  retry_cost_usd: 0.0005

metrics:
  cost:
    # Local 4B model: estimated from GPU-hour amortization
    # DGX Spark GB10 ~$0.20/hr, ~60 tok/s → ~$0.00093/1k tokens
    # Output 2x (decode bound) → ~$0.00185/1k tokens
    # Adjust per actual hardware; set to 0.0 to disable monetary cost tracking
    input_cost_per_1k: 0.00093
    output_cost_per_1k: 0.00185
  cost_api:
    # Qwen3-VL-235B-A22B pricing (per 1k tokens, USD, confirmed 2026-04)
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.005
  energy:
    enabled: true
    kwh_per_step: null
    co2e_kg_per_kwh: null
    hardware_profile: "a100_pcie_40gb"  # B-118 (2026-05-15): canonical paper-grade rerun host = A100 Condenser VM; dgx_spark profile retired per A100 migration
    region: "uk"
    carbon_intensity_g_per_kwh: 220  # UK grid average 2024
    use_psutil: true
    fixed_power_watts: null
    use_pynvml: true
    sample_interval_s: 0.5
    # `track_model_load` / `model_load_amortize_over` removed (§97 ET-12).

checklist:
  enabled: false
  inject_into_prompt: true
  max_items: 4

state_change:
  similarity_threshold: 0.95

# Paper-grade HF model revision pin (codex /stress v6 C8, 2026-05-14).
# qwen3vl_agent.py reads config["model"]["revision"]; previously this block was
# absent so the agent silently fell back to its hard-coded default. Making it
# explicit here means every run's merged config + run metadata proves the loaded
# SHA. All B1 (local_4b) configs inherit this via exp_v2_base.yaml.
# SHA captured 2026-05-07 in DGX baseline lock (笔记 §114); matches HF HEAD.
model:
  revision: "ebb281ec70b05090aa6165b016eac8ec08e71b17"

# B-1881 (2026-06-20): bounded episode-level retry budget for PRE-FLIGHT
# (steps==0) transient-substrate quarantines of class auth/network — see runner
# _run_and_record_episode. Explicit here (not only the config.py default) so a
# reviewer reproduces retry behavior from yaml + commit SHA (codex F6); set 0 to
# restore the legacy single-attempt fail-closed. Applies under paper_grade only
# (never diagnostic_replay). proxy_5xx is NOT episode-retried (owned by B-1880's
# ~11min internal proxy retry); mid-episode (steps>0) failures are NOT retried
# (possible site mutation / stochastic-rollout redraw — 3-AI /stress consensus).
transient_episode_max_retries: 3

backends:
  default_backend: "local_4b"
  local_4b:
    type: "local_qwen"
    path: "Qwen/Qwen3-VL-4B-Instruct"
    quantization: "none"
    device: "cuda"
    # B-270 fix (2026-05-16, A1.7): default OOM safety gate. Pre-fix B1 per-yamls
    # all set 0 (disable) → silent OOM mid-episode contamination risk. 4B-class
    # model bf16 ~10GB; A100-PCIE-40GB margin 12GB allows VWA Docker + watchdog
    # headroom. Per-condition override allowed but discouraged.
    min_free_vram_gb: 12
    # Default raised 512 → 4096 (§97 QV-9/LQ-1): 512 truncates typical
    # thought+JSON envelope. Per-experiment configs may override (e.g.
    # B1 baseline uses 384 for GPU-time tradeoff).
    max_new_tokens: 4096
    # B-137 (/stress A1.1 v8 codex F8, 2026-05-15): aligned 0.1 → 0.0 to
    # match B0 + B2 (both already 0.0). Code path uses do_sample=False so
    # this value never reached generate(); but run_meta records yaml field
    # verbatim → reviewer reading metadata would have seen B1 0.1 vs
    # B0/B2 0.0 as cross-baseline decoding asymmetry (false alarm but
    # paper-grade contract drift). All 3 baselines now 0.0 in metadata.
    temperature: 0.0
    dom_mode: "llm"
    mock_mode: false
  local_gemma:
    type: "local_gemma"
    path: "google/gemma-3-4b-it"
    # Paper-grade revision pin: gemma-3-4b-it HF HEAD SHA captured 2026-05-14
    # (HF account Gluons1, verified on A100). Non-null on purpose: the runner's
    # B-83 logic forwards the top-level (Qwen-specific) model.revision into any
    # backend whose revision is None — an explicit SHA here prevents Gemma from
    # being mis-pinned to the Qwen SHA. Cross-family 3rd baseline, 2026-05-14.
    revision: "093f9f388b31de276ce2de164bdc2081324b9767"
    quantization: "none"
    device: "cuda"
    # B-270 fix (2026-05-16, A1.7): parity with local_4b min_free_vram_gb default.
    min_free_vram_gb: 12
    max_new_tokens: 4096
    temperature: 0.0       # greedy (do_sample=False in the agent); kept for config symmetry
    mock_mode: false
    # Pan-and-scan amendment (2026-06-09, 笔记 §327/§328): Gemma3 vendor-
    # recommended high-res preprocessing for non-square / text-dense images.
    # Default-off ran B2 in a degenerate-vision regime (256 tok/img squash) —
    # A100 probe showed repetition collapse + object-count explosion on
    # gallery pages, both eliminated at do_pan_and_scan=true (768 tok/img).
    # Enabled BEFORE any B2 data enters paper-1; R17895 dom (pas-off) kept as
    # archived config-ablation arm. 3x image tokens => honest latency/cost
    # increase of the vendor-recommended config; exact_id_match token
    # accounting adapts automatically. See
    # docs/analysis/vwa_classifieds/B2_gemma_visual_probe_2026-06-09.md.
    do_pan_and_scan: true
    # Cost: Gemma3-VL is a local ~4B model — reuses the `metrics.cost` local
    # GPU-amortization profile (same size class as B1). A per-model cost review
    # (A100 throughput) is a Tier-3 analysis follow-up, not gating runs.
  api_strong:
    type: "api_proxy"
    api_name: "qwen.qwen3-vl-235b-a22b"
    base_url: "https://i5xpracyci.execute-api.eu-west-2.amazonaws.com/model-api/invoke"
    # B-137 (/stress A1.1 v8 codex F8, 2026-05-15): 0.1 → 0.0 to match
    # B1 + B2 (all 3 baselines now greedy T=0 in metadata). Per-condition
    # B0 configs already override to 0.0; base default aligned for
    # any future config that omits the key.
    temperature: 0.0
    # B0 default raised 512 → 4096 (§97 QV-9/LQ-1). Per-site B0 configs
    # already override to 4096 explicitly (configs/exp_v2_B0_3mode_*.yaml).
    max_new_tokens: 4096
    max_image_payload_bytes: 5242880
    # B-1880 (reddit chain abort #3, 2026-06-19): thickened B0 proxy retry
    # budget + capped backoff. AWS proxy (API Gateway -> Bedrock) emits
    # transient 503s; pre-fix 3 retries x 10/20/40s (~3min incl. ~30s/attempt
    # 503 latency) was exhausted by a ~3min sustained outage on R28130 reddit
    # task 59 -> first quarantine event -> PaperGradeAbortError -> whole
    # 205-task condition lost at 58/205. New budget: 8 retries, 10s base
    # doubling capped at 60s -> ~11min total tolerance (sleeps 10+20+40+60x5
    # =370s + ~9x30s 503 latency) while post-recovery retry latency stays <=60s.
    # Genuine sustained outages (>~11min = real substrate failure) still
    # fail-closed for operator intervention. estimand-neutral (retry success
    # returns identical data); applies to all B0 sites (per-site configs inherit
    # via Hydra defaults + recursive merge, none override these keys).
    max_retries: 8
    retry_backoff_s: 10
    retry_backoff_max_s: 60
    dom_mode: "llm"
    mock_mode: false
    # B-991 (2026-05-17): native tool_choice enabled. AWS proxy probe v2
    # confirmed OpenAI-format tool_calling + top-level `tool_calls` + logprobs.
    # tool_choice="required" (Fire-6 RCA 2026-05-20): "auto" emitted 0% under
    # the real dom system prompt ("Output ONLY valid JSON" suppresses tool
    # calling) → 31% parse_error → injected-wait spirals; "required" restores
    # emit=100%. Full RCA in proxy_api_agent.py tool_choice block.
    use_tool_calling: true
    # GLM fallback fully retired 2026-05-17 (B-991): construction raises
    # RuntimeError when `use_glm_fallback: true`. Keep this key at `false`
    # for any paper-grade run; the legacy `_call_glm_extract` code is
    # deleted. `glm_config` key still parsed for back-compat with old
    # yamls but ignored.
    use_glm_fallback: false
    glm_config: ".auth/glm"

