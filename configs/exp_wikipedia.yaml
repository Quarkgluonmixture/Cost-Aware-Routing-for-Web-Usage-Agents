# Inherit from default.yaml defaults
defaults:
  - configs/default.yaml

experiment:
  name: "wikipedia_vwa_full"
  description: "VWA tasks that include Wikipedia (from test_reddit.raw.json)"

task:
  dataset: "visualwebarena"
  config_file: "external/visualwebarena/config_files/vwa/test_reddit.raw.json"
  # Tasks filtered by sites containing "wikipedia"
  # Optional: specific task IDs to run. If omitted, runs all in the file (subject to sharding)

env:
  # Override default to use real VWA env (not dummy black screen)
  dry_run: false

run:
  seed: 42
  num_shards: 1
  shard_id: 0
  resume: true
  max_retries: 1
  episode_timeout_s: 600
  output_dir: "results/wikipedia"

agent:
  mode: "always_vision" # Options: always_vision, dom_only, router_v0
  max_steps: 40

model:
  api_name: "qwen3-vl-plus-2025-12-19"
