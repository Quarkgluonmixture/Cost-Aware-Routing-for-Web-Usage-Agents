# B1 Phantom-DOM ablation (§25 / §100/§101) — classifieds
# Phantom-DOM = DOM prompt + SoM marks 文本 + 无图（disambiguate prompt vs representation）
# B1 4B 本地推理；与 B1_phantom_<site> 仅差 system prompt（DOM vs SoM）

defaults:
  - configs/exp_v2_base.yaml

experiment:
  phase: "phase1"
  name: "B1_phantom_dom_classifieds"

task:
  include_sites: ["classifieds"]

runtime:
  max_steps: 30
  resume: true

variables:
  primary:
    observation_mode: ["phantom_dom"]

backends:
  default_backend: "local_4b"
  local_4b:
    max_new_tokens: 4096
    min_free_vram_gb: 0

baselines:
  run_b0: false
