name: prose-lint

# Adapted from upstream paper-deslop for the P79 vendored layout: the pipeline
# lives in tools/paper-deslop/ and the paper in docs/checkpoints/paper_drafts/,
# so every entry point takes an explicit path. Blocking/advisory split and the
# ratchet itself are upstream's; scripts/ratchet_lint.sh is what runs locally
# too (`make deslop-ratchet`), so CI and laptop agree by construction.
#
# Caveat: if this is ever made a REQUIRED status check, a PR touching nothing
# under the paths below never reports and merge waits forever — drop the
# `paths:` blocks in that case.

# (paths are duplicated on purpose: GitHub Actions does not support YAML
# anchors/aliases in workflow files.)
on:
  pull_request:
    paths:
      - 'docs/checkpoints/paper_drafts/**'
      - 'tools/paper-deslop/**'
      - '.github/workflows/prose-lint.yml'
  push:
    branches: [master]
    paths:
      - 'docs/checkpoints/paper_drafts/**'
      - 'tools/paper-deslop/**'
      - '.github/workflows/prose-lint.yml'

env:
  VALE_VERSION: 3.15.2
  DESLOP: tools/paper-deslop

jobs:
  lint-and-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pipeline self-test (fixtures + invariant checker)
        run: bash "$DESLOP/tests/run.sh"

      # The ratchet: only files declared clean in deslopped.txt can break the
      # build. An empty list blocks nothing, which is the point — the drafts
      # carry a large pre-existing alert backlog (553 error-level alerts over
      # 19 draft files at install time, 384 of them em dashes) and a build
      # that is red from day one gets ignored.
      - name: Blocking lint (files listed in deslopped.txt)
        run: bash "$DESLOP/scripts/ratchet_lint.sh"

      # PAPER_PATHSPEC is scoped to this step, not the job: the self-test
      # above builds a throwaway repo with a different layout and fails loudly
      # if it inherits a pathspec that matches nothing there.
      - name: Advisory lint (all paper drafts, summary only)
        if: always()
        env:
          PAPER_PATHSPEC: docs/checkpoints/paper_drafts
        run: |
          # "Advisory" means alerts do not block. It does NOT mean a broken
          # lint passes: `|| true` here would launder a vale crash (exit >=2,
          # nothing linted) into a green run, which is the failure this
          # pipeline exists to prevent.
          status=0
          bash "$DESLOP/scripts/ratchet_lint.sh" --all --output=line > /tmp/all.txt 2>&1 || status=$?
          total=$(grep -cE ':[0-9]+:[0-9]+:' /tmp/all.txt || true)
          scope=$(grep -E '^\(advisory: |^no paper sources matched' /tmp/all.txt | head -1)
          {
            echo "## Prose lint (advisory — alerts do not block)"
            echo ""
            echo "**${total:-0} error-level alert(s)**. ${scope:-lint scope unreported}"
            echo "Blocking set: \`$DESLOP/deslopped.txt\` (add a file once it is error-clean)."
            echo ""
            if [ "${total:-0}" -gt 0 ]; then
              echo "| count | rule |"
              echo "|---|---|"
              awk -F: '/:[0-9]+:[0-9]+:/ {print $4}' /tmp/all.txt \
                | sort | uniq -c | sort -rn | head -15 \
                | awk '{printf "| %s | `%s` |\n", $1, $2}'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ge 2 ]; then
            echo "::error::the prose lint could not run (exit $status); nothing was linted"
            cat /tmp/all.txt
            exit "$status"
          fi

  invariant-report:
    # Report-only: ordinary content edits legitimately add numbers and
    # citations. The BLOCKING use of invariant_check.py is inside the
    # deslop-paper skill loop, comparing a rewrite against its baseline.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Invariant drift vs base branch
        run: |
          base="origin/${{ github.base_ref }}"
          {
            echo "## Invariant drift vs \`${{ github.base_ref }}\`"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          changed=$(git diff --name-only "$base"...HEAD -- \
                      'docs/checkpoints/paper_drafts/*.md' \
                      'docs/checkpoints/paper_drafts/**/*.md' \
                      'docs/checkpoints/paper_drafts/**/*.tex' || true)
          for f in $changed; do
            [ -f "$f" ] || continue
            git show "$base:$f" > /tmp/base_version 2>/dev/null || continue
            python3 "$DESLOP/scripts/invariant_check.py" /tmp/base_version "$f" \
              --terms "$DESLOP/terms.txt" --report-only >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
